$schema: https://document-schema.org/draft/2026-06/schema
description: OKF v0.2 concept document — frontmatter with a non-empty type (SPEC §4.1, §11)
frontmatter:
  type: object
  required: [type]
  properties:
    type:
      type: string
      minLength: 1
      not: { enum: [spec, architecture] }
      description: 'type must be non-empty and not spec or architecture: behavior and its rationale live in openspec/specs/'
    title: { type: string }
    description: { type: string }
    resource: { type: string }
    tags: { type: array, items: { type: string } }
    stale_after: { type: string, format: date }
    sources:
      type: array
      items:
        type: object
        required: [resource]
        properties:
          id: { type: string }
          resource: { type: string }
          title: { type: string }
          author: { type: string }
          usage_count: { type: integer }
          last_modified: { type: string, format: date }
    usage_window:
      type: object
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }

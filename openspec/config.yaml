schema: spec-driven

rules:
  specs:
    - Rationale goes only in a `## Rationale` section after `## Requirements`. It states why — the decision in force, who made it, and the alternatives it rejected — and never states behavior.
  design:
    - Each decision names the capability it shapes.

operations:
  archive:
    guidance:
      - Fold every `design.md` decision that stays in force after the change into the `## Rationale` of the capability it shapes, with the alternatives it rejected, in the archive commit.

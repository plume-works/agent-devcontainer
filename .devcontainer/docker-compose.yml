services:
  devcontainer:
    # Tag-only fallback for standalone `docker compose -f .devcontainer/docker-compose.yml`
    # use. The digest pin lives in ../devcontainer-compose-pins.yml, which devcontainer.json layers on
    # top of this file; pass `-f devcontainer-compose-pins.yml` too when invoking compose directly.
    image: ghcr.io/plume-works/agentdev-devcontainer:edge
    # Written by devcontainer-init.sh; see openspec/specs/claude-remote-control.
    hostname: ${CONTAINER_HOSTNAME:-agentdev}
    # No `init` or `command`: the image's supervisor is PID 1, owns the persistent
    # services, and reaps every orphan.

    # Nested Docker and the host GPU for Xpra/VirtualGL need privileged mode, which grants
    # elevated host access: use it only in trusted environments.
    privileged: true

    environment:
      GIT_AUTHOR_NAME:
      GIT_AUTHOR_EMAIL:
      GIT_COMMITTER_NAME:
      GIT_COMMITTER_EMAIL:
      CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH: ${CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH:-5}

    # Written only by .claude/startup.py, so elsewhere no key is set and nothing is
    # overridden; see openspec/specs/cloud-session-devcontainer.
    env_file:
      - path: ./cloud-session.env
        required: false

    extra_hosts:
      - host.docker.internal:host-gateway

    volumes:
      # Mount the git common dir at its host path so `git worktree` checkouts can
      # resolve their .git file back to the main repository.
      - ${GIT_REPO:-$PWD}:${GIT_REPO:-$PWD}:rw
      - ${LOCAL_WORKSPACE_FOLDER:-$PWD}:${LOCAL_WORKSPACE_FOLDER:-$PWD}:rw

      # The workspace itself, at the path devcontainer.json declares as workspaceFolder.
      - ${LOCAL_WORKSPACE_FOLDER:-$PWD}:/workspaces/${WORKSPACE_BASENAME:-project}:rw

      # Agent auth state, shared across all devcontainer instances (worktrees,
      # Codespaces, etc). Declared with an explicit top-level `name:` below so Compose
      # uses the literal volume name instead of prefixing it with the per-project name,
      # which would otherwise isolate each devcontainer instance's auth state.
      #
      # Only Claude Code's credentials are shared, via CLAUDE_SECURESTORAGE_CONFIG_DIR;
      # other agent state is per instance. See openspec/specs/devcontainer-state.
      - agentdev-agents-auth:/root/.agents-auth

      # Written by devcontainer-init.sh, empty when the host names no extra CA.
      - ./.extra-ca.crt:/etc/agentdev/extra-ca.crt:ro

volumes:
  # `name:` pins the literal Docker volume name so it's shared across every
  # devcontainer instance (worktrees, Codespaces, etc), instead of Compose's
  # default per-project name prefix isolating each instance's auth state.
  agentdev-agents-auth:
    name: agentdev-agents-auth
    external: true

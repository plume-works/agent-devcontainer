[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "validate_agent_files"
# Pinned by VALIDATE_AGENT_FILES_VERSION in docker/desktop/agent-desktop.Dockerfile, which
# the image build verifies against the version it actually installs. Bump both together.
version = "1.0.1"
description = "CLI tools for validating agents and their skills."
readme = "README.md"
license = "MIT"
license-files = [
  "LICENSE",
]
# skills-ref, the primary skill validator, requires 3.11.
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "skills-ref>=0.1.1,<0.2"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
validate_agent_files = "validate_agent_files.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["validate_agent_files*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdev_runtime"
version = "0.1.0"
description = "The agentdev-runtime CLI: the root bootstrap, health, and lifecycle commands of agentdev-devcontainer."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  # The runtime contains the parser, so a consumer project needs no Python dependency.
  "json5==0.17.3",
  "pyyaml>=6.0",
]

[project.scripts]
agentdev-runtime = "agentdev_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentdev_runtime*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

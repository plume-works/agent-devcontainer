[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdev-lib"
# Each plugin pins this exact version.
version = "1.0"
description = "Code shared by the scripts of the agentdev plugins: result codes and git helpers."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["agentdev_lib*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

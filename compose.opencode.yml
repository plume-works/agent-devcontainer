# One-project agentdev-deploy deployment behind an existing reverse proxy; launch with
# -f opencode-compose-pins.yml (and -f compose.opencode.bind.yml for a host checkout).
# Settings: docker/deploy/runtime.env.example. Spec: standalone-opencode-runtime.
services:
  opencode:
    # PID 1 is the image's supervisor, so no `init`. Nested Docker needs privileges.
    privileged: true
    restart: unless-stopped
    # Long enough for every service's bounded stop, which runs one after another.
    stop_grace_period: 4m
    environment:
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?set OPENCODE_SERVER_PASSWORD to a nonempty secret}
      AGENTDEV_UID: ${AGENTDEV_UID:-1000}
      AGENTDEV_GID: ${AGENTDEV_GID:-1000}
      AGENTDEV_REPOSITORY_URL: ${AGENTDEV_REPOSITORY_URL:-}
      AGENTDEV_REPOSITORY_REF: ${AGENTDEV_REPOSITORY_REF:-}
      # Required unless AGENTDEV_SKIP_XPRA is set: without it the runtime latches failed.
      XPRA_PASSWORD: ${XPRA_PASSWORD:-}
      AGENTDEV_SKIP_XPRA: ${AGENTDEV_SKIP_XPRA:-}
      AGENTDEV_PREPARE_TIMEOUT: ${AGENTDEV_PREPARE_TIMEOUT:-1800}
      # Empty means the runtime's default; see runtime.env.example.
      AGENTDEV_BOOTSTRAP_TIMEOUT: ${AGENTDEV_BOOTSTRAP_TIMEOUT:-}
      AGENTDEV_SERVICE_START_TIMEOUT: ${AGENTDEV_SERVICE_START_TIMEOUT:-}
      AGENTDEV_RECOVERY_ATTEMPTS: ${AGENTDEV_RECOVERY_ATTEMPTS:-}
      AGENTDEV_RECOVERY_BACKOFF: ${AGENTDEV_RECOVERY_BACKOFF:-}
      AGENTDEV_HEALTHY_RESET: ${AGENTDEV_HEALTHY_RESET:-}
      AGENTDEV_HEALTH_INTERVAL: ${AGENTDEV_HEALTH_INTERVAL:-}
      AGENTDEV_PROBE_FAILURES: ${AGENTDEV_PROBE_FAILURES:-}
      AGENTDEV_STOP_TIMEOUT: ${AGENTDEV_STOP_TIMEOUT:-30}
      AGENTDEV_STRICT_STARTUP: ${AGENTDEV_STRICT_STARTUP:-false}
      # Empty leaves Claude Remote Control off; see runtime.env.example.
      AGENTDEV_CLAUDE_RC_MODE: ${AGENTDEV_CLAUDE_RC_MODE:-}
      AGENTDEV_CLAUDE_RC_SPAWN: ${AGENTDEV_CLAUDE_RC_SPAWN:-}
      ENABLE_FIREWALL: ${ENABLE_FIREWALL:-false}
      AGENTDEV_TRUSTED_PROXY_CIDRS: ${AGENTDEV_TRUSTED_PROXY_CIDRS:-}
      # Passed through only when set: an empty GIT_* value would override user.name/email.
      GH_TOKEN:
      GITHUB_TOKEN:
      GIT_AUTHOR_NAME:
      GIT_AUTHOR_EMAIL:
      GIT_COMMITTER_NAME:
      GIT_COMMITTER_EMAIL:
    volumes:
      - home:/home/agent
      - uv:/uv
      - docker:/var/lib/docker
      - workspace:/workspaces/project
      - agents-auth:/var/lib/agentdev/auth
    # The proxy routes to OpenCode on 4096 and Xpra on 14500 over this network; each
    # service checks its own password. No host ports are published.
    networks:
      - proxy

volumes:
  home:
  uv:
  docker:
  workspace:
  # Provider logins shared by every project container of one UID/GID cohort; give a
  # cohort with other IDs its own name.
  agents-auth:
    name: ${AGENTDEV_AUTH_VOLUME:-agentdev-opencode-auth}

networks:
  proxy:
    name: ${AGENTDEV_PROXY_NETWORK:?set AGENTDEV_PROXY_NETWORK to the existing reverse-proxy network}
    external: true

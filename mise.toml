# The tools the agentdev catalog runs, installed by scripts/install-toolchain at the
# checksums mise.lock records: see ADR-0111. mise.dev.toml adds this repository's hook tools.
[tools]
uv = "0.13.9"
bun = "1.4.5"
jq = "1.8.1"
gh = "2.105.0"
shellcheck = "0.11.0"
pre-commit = "4.7.0"
# install-toolchain skips the tarball's iwec, the MCP server: see ADR-0004.
"github:iwe-org/iwe" = { version = "0.34.0", version_prefix = "iwe-v" }

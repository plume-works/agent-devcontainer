[project]
name = "agentdev"
version = "0.0.0"
description = "The scripts of the agentdev plugin, run through `uv run`."
requires-python = ">=3.12"
dependencies = ["agentdev-lib==1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["lib/depends_on.py"]
sources = ["lib"]

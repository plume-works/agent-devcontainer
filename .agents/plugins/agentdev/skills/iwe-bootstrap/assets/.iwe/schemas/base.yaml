$schema: https://document-schema.org/draft/2026-06/schema
description: >-
  Every document under data/ carries frontmatter with a non-empty type; every
  query selects documents by it. Stacks on top of the per-type schemas.
frontmatter:
  type: object
  required: [type]
  properties:
    type:
      type: string
      minLength: 1
      description: type must be a non-empty string naming the document's kind

name: CI/CD

on:
  workflow_call:
    inputs:
      caller_event_name:
        description: Event name from the calling workflow.
        required: false
        default: ''
        type: string
      clean_build:
        description: >-
          Build every image without the layer cache, as a [ci:clean_build] marker in the
          commit message or pull request body also does.
        required: false
        default: false
        type: boolean
      force_run:
        description: Run CI even when the path filter does not match.
        required: false
        default: false
        type: boolean

defaults:
  run:
    shell: bash -xeuo pipefail {0}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  REGISTRY: ghcr.io
  REGISTRY_USERNAME: ${{ github.actor }} # for nektos/act, use your own username via --actor option
  DEVCONTAINER_IMAGE_NAME: agentdev-devcontainer

jobs:
  paths-filter:
    name: Need to run?
    runs-on: ${{ vars.AMD_ONLY == '1' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    permissions:
      actions: read
      contents: read
    timeout-minutes: 10
    outputs:
      pass: ${{ steps.filter.outputs.pass }}
    steps:
      # nx-set-shas needs the history to find the base commit.
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false

      - name: Filters
        uses: $/.github/actions/paths-filter
        id: filter
        with:
          filters: |
            # The image build context: the .dockerignore allow-list and what it lets through.
            - .dockerignore
            - docker/**
            - .claude-plugin/**
            - .agents/plugins/**
            - .agents/opencode-bridge/**
            - .devcontainer/**
            # Both packages are built into the image, and the suite tests all of py_packages.
            - py_packages/**
            # The devcontainer suite and its environment.
            - scripts/**
            - pyproject.toml
            - uv.lock
            # scripts/tests runs the cloud session startup code from here.
            - .claude/*.py
            - .github/workflows/ci.yml
            - .github/actions/docker/**
            - .github/actions/ai-review-status/**
            - .github/actions/setup-python-venv/**
            - .github/actions/log-debug-stats/**
            - .github/actions/paths-filter/**

      - name: Log debug stats
        if: ${{ always() }}
        uses: $/.github/actions/log-debug-stats
        with:
          github-token: ${{ github.token }}

  build-dev-image:
    name: Development image
    timeout-minutes: 45
    needs: paths-filter
    if: needs.paths-filter.outputs.pass == 'true' || inputs.force_run
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: ${{ vars.AMD_ONLY == '1' && 'amd64' || 'arm64' }}
          - arch: ${{ vars.ARM_ONLY == '1' && 'arm64' || 'amd64' }}
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check commit message for clean-build
        id: clean_build_msg
        if: inputs.caller_event_name == 'push' || inputs.caller_event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const pattern = /\[ci:clean_build\]/;
            const commitMessage = context.payload.head_commit?.message ?? '';
            const prBody = context.payload.pull_request?.body ?? '';
            const found = pattern.test(commitMessage) || pattern.test(prBody);
            core.setOutput('found', found);

      # The build context is the repository root, narrowed by the .dockerignore allow-list;
      # each step mounts only its inputs.
      - name: Build agentdev devcontainer image
        uses: $/.github/actions/docker/build-push-action
        with:
          context: .
          file: docker/devcontainer/agentdev-devcontainer.Dockerfile
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.DEVCONTAINER_IMAGE_NAME }}
          arch: ${{ matrix.arch }}
          registry: ${{ env.REGISTRY }}
          registry-username: ${{ env.REGISTRY_USERNAME }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          no-cache: ${{ inputs.clean_build || steps.clean_build_msg.outputs.found == 'true' }}

      - name: Log debug stats
        if: ${{ always() }}
        uses: $/.github/actions/log-debug-stats
        with:
          github-token: ${{ github.token }}

  merge-dev-image:
    name: Merge development image
    runs-on: ${{ vars.AMD_ONLY == '1' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    permissions:
      packages: write
    needs:
      - build-dev-image
    timeout-minutes: 15
    outputs:
      devcontainer_image_pinned: ${{ steps.merge_devcontainer.outputs.image_pinned }}
      devcontainer_digest: ${{ steps.merge_devcontainer.outputs.digest }}
    steps:
      # Candidate tags only; promote-dev-image moves the public tags after the tests.
      - name: Merge and push agentdev devcontainer image
        id: merge_devcontainer
        uses: $/.github/actions/docker/multiarch-merge
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.DEVCONTAINER_IMAGE_NAME }}
          registry: ${{ env.REGISTRY }}
          registry-username: ${{ env.REGISTRY_USERNAME }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log debug stats
        if: ${{ always() }}
        uses: $/.github/actions/log-debug-stats
        with:
          github-token: ${{ github.token }}

  dev-container-ci:
    name: Devcontainer image
    needs: [merge-dev-image]
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: ${{ vars.AMD_ONLY == '1' && 'amd64' || 'arm64' }}
          - arch: ${{ vars.ARM_ONLY == '1' && 'arm64' || 'amd64' }}
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    permissions:
      packages: read
    steps:
      - name: Install updated Skopeo needed for docker/buildx
        run: |
          sudo apt-get update
          sudo apt-get install skopeo -y

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch image pin to use the image built in this workflow
        env:
          MERGED_IMAGE: ${{ needs.merge-dev-image.outputs.devcontainer_image_pinned }}
        run: |
          echo "The digest pin lives in devcontainer-compose-pins.yml, which devcontainer.json layers"
          echo "over .devcontainer/docker-compose.yml; patching it here points the smoke"
          echo "test at the image built in this workflow."
          echo
          sed -i "s|image: ghcr.io/.*|image: ${MERGED_IMAGE}|" \
            devcontainer-compose-pins.yml
          grep -n 'image:' devcontainer-compose-pins.yml

      # Its own step, so the pull's duration shows apart from the build and tests.
      - name: Pull the candidate image
        env:
          MERGED_IMAGE: ${{ needs.merge-dev-image.outputs.devcontainer_image_pinned }}
        run: docker pull "$MERGED_IMAGE"

      - name: Build and test dev container image
        # Without a Dev Container Feature, the CLI's generated Dockerfile lies outside every
        # build context, and bake refuses to read it unless its fs entitlement check is off.
        env:
          BUILDX_BAKE_ENTITLEMENTS_FS: '0'
        uses: devcontainers/ci@v0.3.1900000450
        with:
          configFile: .devcontainer/devcontainer.json
          noCache: true
          runCmd: |
            set -eu
            # The image's systemd units must be ready, nested Docker included.
            agentdev-runtime health ready
            docker run --rm hello-world | head -n 5

            # The provisioned toolchain must be present and on PATH
            bun --version
            if command -v node; then echo 'unexpected Node.js on PATH' >&2; exit 1; fi
            uv --version
            gh --version | head -n 1
            zizmor --version
            # Pre-commit's gitleaks and actionlint hooks run these pinned binaries, without Go.
            gitleaks version
            actionlint --version | head -n 1
            if command -v go; then echo 'unexpected Go toolchain on PATH' >&2; exit 1; fi
            command -v xpra
            command -v iptables ipset
            command -v ssh ssh-keygen

            # The image must carry a launchable browser; this command cannot
            # download one when PLAYWRIGHT_BROWSERS_PATH is already populated.
            playwright --version
            mkdir -p .tmp
            playwright screenshot --browser chromium \
              'data:text/html,<title>playwright-smoke</title>' \
              .tmp/playwright-smoke.png
            test -s .tmp/playwright-smoke.png

            # The bundled validator must be the image's copy, not the project
            # environment's editable install. Nothing activates an environment,
            # so the project environment can no longer mask the image's copy.
            test "$(command -v validate_agent_files)" = /usr/local/bin/validate_agent_files
            validate_agent_files --help > /dev/null

            # The repo's own checks
            uv sync --locked --all-groups --all-extras
            # The runtime tests mostly wait on subprocess deadlines, so workers beyond the core count pay.
            uv run pytest -n 8 py_packages .agents/plugins/agentdev/tests .agents/plugins/agentdev-iwe/tests scripts/tests
            bun test ./.github/actions/ai-review-status

            # The tests that the runtime account skips run as root.
            # They must not leave a root-owned file.
            touch .tmp/root-tests.stamp
            scripts/run-root-tests -n 8 scripts/tests
            left="$(find . /tmp/agentdev-tests -newer .tmp/root-tests.stamp -user root -print 2>/dev/null | head -n 5)"
            if [ -n "$left" ]; then echo "root-owned leftovers: $left" >&2; exit 1; fi

      # The devcontainer step uses the .venv of the checkout, so the host steps use a different venv.
      - uses: $/.github/actions/setup-python-venv
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/venv

      # The stress tests have a separate step, so CI shows their duration and the duration of
      # the unit tests as two items.
      - name: Run the stress tests
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/venv
        run: uv run pytest -m stress -n auto scripts/tests

      - name: Log debug stats
        if: ${{ always() }}
        uses: $/.github/actions/log-debug-stats
        with:
          github-token: ${{ github.token }}

  # Every hook on every file with the tools the rebuilt image provisions, so a bump that
  # breaks a hook fails before promotion. See ADR-0064.
  candidate-pre-commit:
    name: pre-commit on the candidate image
    needs: [merge-dev-image]
    runs-on: ${{ vars.AMD_ONLY == '1' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.merge-dev-image.outputs.devcontainer_image_pinned }} # zizmor: ignore[unpinned-images] the merge output is name@sha256 digest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 30
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: '*'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: uv sync
        run: uv sync --locked

      - name: pre-commit install-hooks
        run: uv run pre-commit install-hooks

      - name: pre-commit run
        env:
          SKIP: no-commit-to-branch
        run: uv run pre-commit run --all-files --show-diff-on-failure

  devcontainer-acceptance:
    name: Dev Container runtime acceptance
    needs: [merge-dev-image]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: ${{ vars.AMD_ONLY == '1' && 'amd64' || 'arm64' }}
          - arch: ${{ vars.ARM_ONLY == '1' && 'arm64' || 'amd64' }}
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: $/.github/actions/setup-python-venv
      - uses: oven-sh/setup-bun@v2.2.0

      # Its own step, so the pull's duration shows apart from the fixtures.
      - name: Pull the candidate image
        env:
          AGENTDEV_DEVCONTAINER_TEST_IMAGE: ${{ needs.merge-dev-image.outputs.devcontainer_image_pinned }}
        run: docker pull "$AGENTDEV_DEVCONTAINER_TEST_IMAGE"

      # Direct and derived consumers, then this repository's own clone and worktree,
      # through create, attach, stop/start, and rebuild.
      - name: Run Dev Container fixtures on the native architecture
        env:
          AGENTDEV_DEVCONTAINER_TEST_IMAGE: ${{ needs.merge-dev-image.outputs.devcontainer_image_pinned }}
        run: |
          uv run pytest scripts/tests/test_agentdev_devcontainer_image.py \
            scripts/tests/test_agentdev_devcontainer_repository.py -rs

      - name: Log debug stats
        if: ${{ always() }}
        uses: $/.github/actions/log-debug-stats
        with:
          github-token: ${{ github.token }}

  promote-dev-image:
    name: Promote development image
    runs-on: ${{ vars.AMD_ONLY == '1' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    permissions:
      contents: read
      packages: write
    needs:
      - merge-dev-image
      - dev-container-ci
      - candidate-pre-commit
      - devcontainer-acceptance
    timeout-minutes: 15
    steps:
      # Full history, so the promote action can tell whether a tag names a newer commit.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Promote agentdev devcontainer image
        uses: $/.github/actions/docker/promote
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.DEVCONTAINER_IMAGE_NAME }}
          digest: ${{ needs.merge-dev-image.outputs.devcontainer_digest }}
          registry: ${{ env.REGISTRY }}
          registry-username: ${{ env.REGISTRY_USERNAME }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log debug stats
        if: ${{ always() }}
        uses: $/.github/actions/log-debug-stats
        with:
          github-token: ${{ github.token }}

  finished:
    name: CI finished
    needs:
      [
        paths-filter,
        build-dev-image,
        merge-dev-image,
        dev-container-ci,
        candidate-pre-commit,
        devcontainer-acceptance,
        promote-dev-image,
      ]
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 10
    if: always()
    steps:
      - name: Execution was not needed!
        if: needs.paths-filter.outputs.pass != 'true' && !inputs.force_run
        run: exit 0
      - name: All jobs succeeded!
        if: ${{ success() }}
        run: exit 0
      - name: Some jobs have failed!
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1
      - name: Some jobs have been cancelled!
        if: ${{ cancelled() || contains(needs.*.result, 'cancelled') }}
        run: exit 1

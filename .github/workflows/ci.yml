name: CI/CD

on:
  workflow_call:
    inputs:
      caller_event_name:
        description: Event name from the calling workflow.
        required: false
        default: ''
        type: string
      clean_build:
        description: Build images from scratch instead of reusing the edge image.
        required: false
        default: false
        type: boolean
      force_run:
        description: Run CI even when the path filter does not match.
        required: false
        default: false
        type: boolean

defaults:
  run:
    shell: bash -xeuo pipefail {0}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  REGISTRY: ghcr.io
  REGISTRY_USERNAME: ${{ github.actor }} # for nektos/act, use your own username via --actor option
  ANSIBLE_IMAGE_NAME: ubuntu-ansible
  BASE_IMAGE_NAME: agentdev-base
  DEPLOY_IMAGE_NAME: agentdev-deploy
  DEVCONTAINER_IMAGE_NAME: agentdev-devcontainer

jobs:
  paths-filter:
    name: Need to run?
    runs-on: ${{ vars.AMD_ONLY == '1' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    permissions:
      actions: read
    timeout-minutes: 10
    outputs:
      pass: ${{ steps.filter.outputs.pass }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Filters
        uses: ./.github/actions/paths-filter
        id: filter
        with:
          event-name: ${{ inputs.caller_event_name }}
          extra-filter: |
            - .github/workflows/ci.yml
            - .github/actions/log-debug-stats/**
            # The devcontainer suite is the only check of the deployment compose files. The
            # pins file stays out, so a pin bump never rebuilds the image it names.
            - compose.opencode*.yml

      - name: Log debug stats
        if: ${{ always() }}
        uses: ./.github/actions/log-debug-stats
        with:
          github-token: ${{ github.token }}

  build-dev-image:
    name: Development image
    timeout-minutes: 45
    needs: paths-filter
    if: needs.paths-filter.outputs.pass == 'true' || inputs.force_run
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: ${{ vars.AMD_ONLY == '1' && 'amd64' || 'arm64' }}
          - arch: ${{ vars.ARM_ONLY == '1' && 'arm64' || 'amd64' }}
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Check commit message for clean-build
        id: clean_build_msg
        if: inputs.caller_event_name == 'push' || inputs.caller_event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const pattern = /\[ci:clean_build\]/;
            const commitMessage = context.payload.head_commit?.message ?? '';
            const prBody = context.payload.pull_request?.body ?? '';
            const found = pattern.test(commitMessage) || pattern.test(prBody);
            core.setOutput('found', found);

      # Warm start: the ansible base image is normally rebuilt on top of the
      # previous agentdev-base image so apt and the provisioning steps hit their
      # caches. Fall back to a clean ubuntu base on main, tags, merge queues,
      # and when a clean build is explicitly requested.
      - name: Set base image refs
        id: base_refs
        env:
          CLEAN_BUILD_DISPATCH: ${{ inputs.clean_build }}
          CLEAN_BUILD_COMMIT: ${{ steps.clean_build_msg.outputs.found == 'true' }}
          CLEAN_BUILD_MERGE_GROUP: ${{ inputs.caller_event_name == 'merge_group' }}
          IS_MAIN: ${{ github.ref == 'refs/heads/main' || contains(github.ref, 'tags/v') }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "ansible_base=ubuntu:24.04" >> "$GITHUB_OUTPUT"

          if [[ $CLEAN_BUILD_DISPATCH = true ]] \
            || [[ $CLEAN_BUILD_COMMIT = true ]] \
            || [[ $CLEAN_BUILD_MERGE_GROUP = true ]] \
            || [[ $IS_MAIN = true ]]; then
            echo "Clean build required"
            exit 0
          fi

          DEV_IMAGE="${REGISTRY}/${{ github.repository_owner }}/${BASE_IMAGE_NAME}:edge"

          sudo apt-get update -qq && sudo apt-get install -y -qq skopeo

          if skopeo inspect --creds "${GITHUB_ACTOR}:${GITHUB_TOKEN}" \
             "docker://${DEV_IMAGE}" >/dev/null 2>&1; then
             echo "Using edge image as base to speed up build. Include [ci:clean_build] in your commit message to force a clean build."
             echo "ansible_base=$DEV_IMAGE" >> "$GITHUB_OUTPUT"
          else
            echo "Edge image not found; building from scratch"
          fi

      - name: Read Playwright version from the Ansible role
        id: playwright_version
        run: |
          defaults=ansible/roles/playwright_browser/defaults/main.yml
          version=$(sed -n 's/^playwright_browser_version: *"\([^"]*\)"$/\1/p' "$defaults")
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build ubuntu ansible image
        id: build_ubuntu_ansible
        uses: ./.github/actions/docker/build-push-action
        with:
          context: docker/ansible
          file: docker/ansible/Dockerfile
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.ANSIBLE_IMAGE_NAME }}
          arch: ${{ matrix.arch }}
          registry: ${{ env.REGISTRY }}
          registry-username: ${{ env.REGISTRY_USERNAME }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          build-args: |
            BASE_IMAGE=${{ steps.base_refs.outputs.ansible_base }}

      # The base image's build context is the repository root: the dockerfile
      # bind-mounts the whole context at /provision so Ansible can read both
      # ansible/ and docker/bin/gh.
      - name: Build agentdev base image
        id: build
        uses: ./.github/actions/docker/build-push-action
        with:
          context: .
          file: docker/base/agentdev-base.Dockerfile
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.BASE_IMAGE_NAME }}
          arch: ${{ matrix.arch }}
          registry: ${{ env.REGISTRY }}
          registry-username: ${{ env.REGISTRY_USERNAME }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          build-args: |
            FROM_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.ANSIBLE_IMAGE_NAME }}@${{ steps.build_ubuntu_ansible.outputs.digest }}
            PLAYWRIGHT_VERSION=${{ steps.playwright_version.outputs.version }}

      # Both runtimes are siblings layered on exactly the base digest this job just
      # built, never on each other; see spec/agentdev-runtime-images.
      - name: Build agentdev deploy image
        uses: ./.github/actions/docker/build-push-action
        with:
          context: .
          file: docker/deploy/agentdev-deploy.Dockerfile
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.DEPLOY_IMAGE_NAME }}
          arch: ${{ matrix.arch }}
          registry: ${{ env.REGISTRY }}
          registry-username: ${{ env.REGISTRY_USERNAME }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          build-args: |
            FROM_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.BASE_IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      - name: Build agentdev devcontainer image
        uses: ./.github/actions/docker/build-push-action
        with:
          context: .
          file: docker/devcontainer/agentdev-devcontainer.Dockerfile
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.DEVCONTAINER_IMAGE_NAME }}
          arch: ${{ matrix.arch }}
          registry: ${{ env.REGISTRY }}
          registry-username: ${{ env.REGISTRY_USERNAME }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          build-args: |
            FROM_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.BASE_IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      - name: Log debug stats
        if: ${{ always() }}
        uses: ./.github/actions/log-debug-stats
        with:
          github-token: ${{ github.token }}

  merge-dev-image:
    name: Merge development image
    runs-on: ${{ vars.AMD_ONLY == '1' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    permissions:
      packages: write
    needs:
      - build-dev-image
    timeout-minutes: 15
    outputs:
      devcontainer_image_pinned: ${{ steps.merge_devcontainer.outputs.image_pinned }}
      deploy_image_pinned: ${{ steps.merge_deploy.outputs.image_pinned }}
      ansible_digest: ${{ steps.merge_ansible.outputs.digest }}
      base_digest: ${{ steps.merge.outputs.digest }}
      deploy_digest: ${{ steps.merge_deploy.outputs.digest }}
      devcontainer_digest: ${{ steps.merge_devcontainer.outputs.digest }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Candidate tags only; promote-dev-image moves the public tags after the tests.
      - name: Merge and push ubuntu ansible image
        id: merge_ansible
        uses: ./.github/actions/docker/multiarch-merge
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.ANSIBLE_IMAGE_NAME }}
          registry: ${{ env.REGISTRY }}
          registry-username: ${{ env.REGISTRY_USERNAME }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge and push agentdev base image
        id: merge
        uses: ./.github/actions/docker/multiarch-merge
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.BASE_IMAGE_NAME }}
          registry: ${{ env.REGISTRY }}
          registry-username: ${{ env.REGISTRY_USERNAME }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge and push agentdev deploy image
        id: merge_deploy
        uses: ./.github/actions/docker/multiarch-merge
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.DEPLOY_IMAGE_NAME }}
          registry: ${{ env.REGISTRY }}
          registry-username: ${{ env.REGISTRY_USERNAME }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge and push agentdev devcontainer image
        id: merge_devcontainer
        uses: ./.github/actions/docker/multiarch-merge
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.DEVCONTAINER_IMAGE_NAME }}
          registry: ${{ env.REGISTRY }}
          registry-username: ${{ env.REGISTRY_USERNAME }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log debug stats
        if: ${{ always() }}
        uses: ./.github/actions/log-debug-stats
        with:
          github-token: ${{ github.token }}

  dev-container-ci:
    name: Devcontainer image
    needs: [merge-dev-image]
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: ${{ vars.AMD_ONLY == '1' && 'amd64' || 'arm64' }}
          - arch: ${{ vars.ARM_ONLY == '1' && 'arm64' || 'amd64' }}
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    permissions:
      packages: read
    steps:
      - name: Install updated Skopeo needed for docker/buildx
        run: |
          sudo apt-get update
          sudo apt-get install skopeo -y

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch image pin to use the image built in this workflow
        env:
          MERGED_IMAGE: ${{ needs.merge-dev-image.outputs.devcontainer_image_pinned }}
        run: |
          echo "The digest pin lives in devcontainer-compose-pins.yml, which devcontainer.json layers"
          echo "over .devcontainer/docker-compose.yml; patching it here points the smoke"
          echo "test at the image built in this workflow."
          echo
          sed -i "s|image: ghcr.io/.*|image: ${MERGED_IMAGE}|" \
            devcontainer-compose-pins.yml
          grep -n 'image:' devcontainer-compose-pins.yml

      # Its own step, so the pull's duration shows apart from the build and tests.
      - name: Pull the candidate image
        env:
          MERGED_IMAGE: ${{ needs.merge-dev-image.outputs.devcontainer_image_pinned }}
        run: docker pull "$MERGED_IMAGE"

      - name: Build and test dev container image
        uses: devcontainers/ci@v0.3.1900000450
        with:
          configFile: .devcontainer/devcontainer.json
          noCache: true
          runCmd: |
            # The image's supervised runtime must be ready, nested Docker included.
            /opt/agentdev-runtime/runtime-health.sh ready
            docker run --rm hello-world | head -n 5

            # The provisioned toolchain must be present and on PATH
            bun --version
            node --version
            uv --version
            gh --version | head -n 1
            cmake --version | head -n 1
            zizmor --version
            # Pre-commit's gitleaks and actionlint hooks run these pinned binaries, without Go.
            gitleaks version
            actionlint --version | head -n 1
            if command -v go; then echo 'unexpected Go toolchain on PATH' >&2; exit 1; fi
            command -v xpra
            command -v init-firewall.sh
            command -v gnome-keyring-daemon

            # The image must carry a launchable browser; this command cannot
            # download one when PLAYWRIGHT_BROWSERS_PATH is already populated.
            playwright --version
            mkdir -p .tmp
            playwright screenshot --browser chromium \
              'data:text/html,<title>playwright-smoke</title>' \
              .tmp/playwright-smoke.png
            test -s .tmp/playwright-smoke.png

            # The bundled validator must be the image's copy, not the project
            # environment's editable install. Nothing activates an environment,
            # so the project environment can no longer mask the image's copy.
            test "$(command -v validate_agent_files)" = /usr/local/bin/validate_agent_files
            validate_agent_files --help > /dev/null

            # The repo's own checks
            uv sync --locked --all-groups --all-extras
            uv run pytest py_packages .agents/plugins/agentdev/tests \
              .agents/plugins/self-improve/tests scripts/tests

      - name: Log debug stats
        if: ${{ always() }}
        uses: ./.github/actions/log-debug-stats
        with:
          github-token: ${{ github.token }}

  deploy-acceptance:
    name: Deploy runtime acceptance
    needs: [merge-dev-image]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: ${{ vars.AMD_ONLY == '1' && 'amd64' || 'arm64' }}
          - arch: ${{ vars.ARM_ONLY == '1' && 'arm64' || 'amd64' }}
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup-python-venv

      # Root, because the fixtures hand checkouts to the runtime's UIDs.
      - name: Run container acceptance on the native architecture
        env:
          AGENTDEV_RUNTIME_TEST_IMAGE: ${{ needs.merge-dev-image.outputs.deploy_image_pinned }}
        run: |
          sudo env "PATH=$PATH" "AGENTDEV_RUNTIME_TEST_IMAGE=$AGENTDEV_RUNTIME_TEST_IMAGE" \
            .devcontainer/scripts/test-agent-runtime.sh

      - name: Log debug stats
        if: ${{ always() }}
        uses: ./.github/actions/log-debug-stats
        with:
          github-token: ${{ github.token }}

  devcontainer-acceptance:
    name: Dev Container runtime acceptance
    needs: [merge-dev-image]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: ${{ vars.AMD_ONLY == '1' && 'amd64' || 'arm64' }}
          - arch: ${{ vars.ARM_ONLY == '1' && 'arm64' || 'amd64' }}
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup-python-venv
      - uses: oven-sh/setup-bun@v2.2.0

      # Its own step, so the pull's duration shows apart from the fixtures.
      - name: Pull the candidate image
        env:
          AGENTDEV_DEVCONTAINER_TEST_IMAGE: ${{ needs.merge-dev-image.outputs.devcontainer_image_pinned }}
        run: docker pull "$AGENTDEV_DEVCONTAINER_TEST_IMAGE"

      # Direct and derived consumers, then this repository's own clone and worktree,
      # through create, attach, stop/start, and rebuild.
      - name: Run Dev Container fixtures on the native architecture
        env:
          AGENTDEV_DEVCONTAINER_TEST_IMAGE: ${{ needs.merge-dev-image.outputs.devcontainer_image_pinned }}
        run: |
          uv run pytest scripts/tests/test_agentdev_devcontainer_image.py \
            scripts/tests/test_agentdev_devcontainer_repository.py \
            scripts/tests/test_template_consume_migration.py -rs

      - name: Log debug stats
        if: ${{ always() }}
        uses: ./.github/actions/log-debug-stats
        with:
          github-token: ${{ github.token }}

  promote-dev-image:
    name: Promote development image
    runs-on: ${{ vars.AMD_ONLY == '1' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    permissions:
      contents: read
      packages: write
    needs:
      - merge-dev-image
      - dev-container-ci
      - deploy-acceptance
      - devcontainer-acceptance
    timeout-minutes: 15
    steps:
      # Full history, so the promote action can tell whether a tag names a newer commit.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Promote ubuntu ansible image
        uses: ./.github/actions/docker/promote
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.ANSIBLE_IMAGE_NAME }}
          digest: ${{ needs.merge-dev-image.outputs.ansible_digest }}
          registry: ${{ env.REGISTRY }}
          registry-username: ${{ env.REGISTRY_USERNAME }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote agentdev base image
        uses: ./.github/actions/docker/promote
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.BASE_IMAGE_NAME }}
          digest: ${{ needs.merge-dev-image.outputs.base_digest }}
          registry: ${{ env.REGISTRY }}
          registry-username: ${{ env.REGISTRY_USERNAME }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote agentdev deploy image
        uses: ./.github/actions/docker/promote
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.DEPLOY_IMAGE_NAME }}
          digest: ${{ needs.merge-dev-image.outputs.deploy_digest }}
          registry: ${{ env.REGISTRY }}
          registry-username: ${{ env.REGISTRY_USERNAME }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote agentdev devcontainer image
        uses: ./.github/actions/docker/promote
        with:
          image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.DEVCONTAINER_IMAGE_NAME }}
          digest: ${{ needs.merge-dev-image.outputs.devcontainer_digest }}
          registry: ${{ env.REGISTRY }}
          registry-username: ${{ env.REGISTRY_USERNAME }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log debug stats
        if: ${{ always() }}
        uses: ./.github/actions/log-debug-stats
        with:
          github-token: ${{ github.token }}

  finished:
    name: CI finished
    needs:
      [
        paths-filter,
        build-dev-image,
        merge-dev-image,
        dev-container-ci,
        deploy-acceptance,
        devcontainer-acceptance,
        promote-dev-image,
      ]
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 10
    if: always()
    steps:
      - name: Execution was not needed!
        if: needs.paths-filter.outputs.pass != 'true' && !inputs.force_run
        run: exit 0
      - name: All jobs succeeded!
        if: ${{ success() }}
        run: exit 0
      - name: Some jobs have failed!
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1
      - name: Some jobs have been cancelled!
        if: ${{ cancelled() || contains(needs.*.result, 'cancelled') }}
        run: exit 1

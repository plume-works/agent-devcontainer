name: OpenCode runtime pin checks

# Acceptance on both native arches for the digest opencode-compose-pins.yml proposes;
# builds and publishes nothing (runtime sources go through CI/CD). Spec: image-pinning.
on:
  pull_request:
    paths:
      - opencode-compose-pins.yml
      - compose.opencode.yml
      - compose.opencode.bind.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  acceptance:
    name: Pinned runtime acceptance
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: ${{ vars.AMD_ONLY == '1' && 'amd64' || 'arm64' }}
          - arch: ${{ vars.ARM_ONLY == '1' && 'arm64' || 'amd64' }}
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # CI/CD accepts the image it builds, never the pinned digest; so a changed pin
      # always runs here, and anything else is skipped when CI/CD's filter matched.
      - name: Check whether CI/CD covers this change
        id: scope
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/paths-filter
        with:
          event-name: ${{ github.event_name }}
          extra-filter: |
            - .github/workflows/ci.yml
            - .github/actions/log-debug-stats/**

      - name: Check whether the pin changed
        id: pin-change
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: |
            pin:
              - opencode-compose-pins.yml

      - name: Decide whether to run acceptance
        id: gate
        env:
          COVERED: ${{ steps.scope.outputs.pass }}
          PIN_CHANGED: ${{ steps.pin-change.outputs.pin }}
        run: |
          if [[ $COVERED == true && $PIN_CHANGED != true ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the proposed image pin
        id: pin
        if: steps.gate.outputs.skip != 'true'
        run: |
          image="$(sed -n 's/^ *image: *//p' opencode-compose-pins.yml)"
          if [[ $image != *@sha256:* ]]; then
            echo "::error::opencode-compose-pins.yml must pin a tag and digest, got '$image'"
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4.6.0
        if: steps.gate.outputs.skip != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup-python-venv
        if: steps.gate.outputs.skip != 'true'

      - name: Render the deployment
        if: steps.gate.outputs.skip != 'true'
        run: uv run pytest scripts/tests/test_agent_runtime_compose.py

      # Root, because the fixtures hand checkouts to the runtime's UIDs.
      - name: Run container acceptance on the native architecture
        if: steps.gate.outputs.skip != 'true'
        env:
          AGENTDEV_RUNTIME_TEST_IMAGE: ${{ steps.pin.outputs.image }}
        run: |
          sudo env "PATH=$PATH" "AGENTDEV_RUNTIME_TEST_IMAGE=$AGENTDEV_RUNTIME_TEST_IMAGE" \
            .devcontainer/scripts/test-agent-runtime.sh

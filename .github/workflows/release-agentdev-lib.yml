name: Release agentdev-lib

on:
  push:
    tags:
      - agentdev-lib/*

permissions: {}

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: false

      - name: Build the wheel
        working-directory: py_packages/agentdev_lib
        run: uv build --wheel --out-dir "$GITHUB_WORKSPACE/dist"

      - name: Upload the wheel
        uses: actions/upload-artifact@v7.0.2
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download the wheel
        uses: actions/download-artifact@v8.0.2
        with:
          name: wheel
          path: dist

      - name: Publish through trusted publishing
        uses: pypa/gh-action-pypi-publish@v1.14.3

  release:
    name: GitHub Release
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the wheel
        uses: actions/download-artifact@v8.0.2
        with:
          name: wheel
          path: dist

      - name: Create the release with the wheel
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/*.whl --repo "$REPOSITORY" --title "$TAG" --notes "agentdev-lib ${TAG#agentdev-lib/}"

name: Knowledge base validation

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  paths-filter:
    name: Need to run?
    runs-on: ${{ vars.AMD_ONLY == '1' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    permissions:
      contents: read
    timeout-minutes: 10
    outputs:
      pass: ${{ steps.filter.outputs.pass }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Filters
        uses: ./.github/actions/paths-filter
        id: filter
        with:
          extra-filter: |
            - docs/knowledge/**
            - .iwe/**
            - templates/iwe/**
            - ansible/roles/dev_tools/defaults/main.yml
            - scripts/fetch-pinned-tool.py
            - .github/workflows/validate-knowledge-base.yml
            - .github/actions/log-debug-stats/**

      - name: Log debug stats
        if: ${{ always() }}
        uses: ./.github/actions/log-debug-stats
        with:
          github-token: ${{ github.token }}

  validate-knowledge-base:
    name: Validate knowledge base
    runs-on: ubuntu-latest
    needs: paths-filter
    permissions:
      contents: read
    if: needs.paths-filter.outputs.pass == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # The shared paths-filter action carries an image-staleness baseline that
      # matches far more than the seed, so this gate uses dorny directly.
      - name: Did the seed, schemas, or its tests change?
        id: seed-filter
        uses: dorny/paths-filter@v4.0.3
        with:
          base: ${{ github.event_name == 'pull_request' && '' || 'main' }}
          filters: |
            seed:
              - templates/iwe/**
              - .iwe/**
              - docs/knowledge/tests/test_iwe_seed.py

      - name: Set up the Python environment
        uses: ./.github/actions/setup-python-venv

      # The image's pin, so CI validates with the iwe that writes .iwe/config.toml.
      - name: Install the pinned iwe
        run: |
          uv run --frozen scripts/fetch-pinned-tool.py iwe "$RUNNER_TEMP/iwe"
          echo "$RUNNER_TEMP/iwe" >> "$GITHUB_PATH"

      - name: Validate every document against its schemas
        run: iwe schema validate

      - name: Check that normalization is a no-op
        run: |
          iwe normalize
          git diff --exit-code

      - name: Check that ticked plan checkboxes carry evidence
        run: uv run pytest docs/knowledge/tests --ignore=docs/knowledge/tests/test_iwe_seed.py

      # The seed is not a member of this graph, so the steps above never touch
      # it; these tests assemble it as a consumer workspace instead.
      - name: Validate the consumer IWE seed
        if: steps.seed-filter.outputs.seed == 'true'
        run: uv run pytest docs/knowledge/tests/test_iwe_seed.py

      - name: Log debug stats
        if: ${{ always() }}
        uses: ./.github/actions/log-debug-stats
        with:
          github-token: ${{ github.token }}

  finished:
    name: Knowledge base validation finished
    needs: [paths-filter, validate-knowledge-base]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Execution was not needed!
        if: needs.paths-filter.outputs.pass != 'true'
        run: |
          exit 0
      - name: All jobs succeeded!
        if: ${{ success() }}
        run: |
          exit 0
      - name: Some jobs have failed!
        if: ${{ contains(needs.*.result, 'failure') }}
        run: |
          exit 1
      - name: Some jobs have been cancelled!
        if: ${{ cancelled() || contains(needs.*.result, 'cancelled') }}
        run: |
          exit 1

      - name: Log debug stats
        if: ${{ always() }}
        uses: ./.github/actions/log-debug-stats
        with:
          github-token: ${{ github.token }}

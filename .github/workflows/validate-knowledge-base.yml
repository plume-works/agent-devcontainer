name: Knowledge base validation

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  paths-filter:
    name: Need to run?
    runs-on: ${{ vars.AMD_ONLY == '1' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    permissions:
      actions: read
      contents: read
    timeout-minutes: 10
    outputs:
      pass: ${{ steps.filter.outputs.pass }}
    steps:
      - name: Filters
        uses: anton-matosov/actions/paths-filter@v1.0.0
        id: filter
        with:
          filters: |
            - docs/knowledge/**
            - .iwe
            - .agents/plugins/agentdev-iwe/skills/iwe-bootstrap/assets/**
            - mise.toml
            - mise.lock
            - pyproject.toml
            - uv.lock
            - .github/workflows/validate-knowledge-base.yml
            - .github/actions/setup-python-venv/**
            - .github/actions/log-debug-stats/**

      - name: Log debug stats
        if: ${{ always() }}
        uses: $/.github/actions/log-debug-stats
        with:
          github-token: ${{ github.token }}

  validate-knowledge-base:
    name: Validate knowledge base
    runs-on: ubuntu-latest
    needs: paths-filter
    permissions:
      contents: read
    if: needs.paths-filter.outputs.pass == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up the Python environment
        uses: $/.github/actions/setup-python-venv

      # mise.lock's iwe, so CI validates with the iwe that writes .iwe/config.toml.
      - name: Install the locked iwe
        uses: jdx/mise-action@v5.3.0
        with:
          install_args: github:iwe-org/iwe
        env:
          MISE_LOCKED: '1'
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

      - name: Validate every document against its schemas
        run: iwe schema validate

      - name: Check that normalization is a no-op
        run: |
          iwe normalize
          git diff --exit-code

      # Equal ranks are valid and break by key; the warning only surfaces them.
      - name: Warn about work items that share a rank
        continue-on-error: true
        env:
          RANKED: '{rank: {$exists: true}}'
          PROJECTION: key=$key,rank
        run: |
          iwe find --filter "$RANKED" --project "$PROJECTION" -f json \
            | jq -r 'group_by(.rank)[] | select(length > 1)
                | "::warning::rank \(.[0].rank) is shared by \(map(.key) | join(", "))"'

      - name: Run the knowledge-base graph tests
        run: uv run pytest docs/knowledge/tests

      - name: Log debug stats
        if: ${{ always() }}
        uses: $/.github/actions/log-debug-stats
        with:
          github-token: ${{ github.token }}

  finished:
    name: Knowledge base validation finished
    needs: [paths-filter, validate-knowledge-base]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    if: always()
    steps:
      - uses: anton-matosov/actions/ci-finished@v1.0.0
        with:
          needs: ${{ toJSON(needs) }}

      - name: Log debug stats
        if: ${{ always() }}
        uses: $/.github/actions/log-debug-stats
        with:
          github-token: ${{ github.token }}

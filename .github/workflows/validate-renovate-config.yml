name: Validate Renovate config

on:
  pull_request:
    paths:
      - .github/renovate.json
      - .github/workflows/validate-renovate-config.yml
  push:
    branches:
      - main
    paths:
      - .github/renovate.json
      - .github/workflows/validate-renovate-config.yml
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate Renovate config
    runs-on: ${{ vars.AMD_ONLY == '1' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Renovate is deliberately unpinned here while the pre-commit hook pins
      # it, and --no-global is load-bearing: see
      # architecture/renovate-config-validation.
      - name: Validate .github/renovate.json
        run: |
          npx --yes --package renovate renovate-config-validator \
            --no-global --strict .github/renovate.json

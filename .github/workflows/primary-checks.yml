name: Primary checks

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:
    inputs:
      clean_build:
        description: 'Build images from scratch (no base from main)'
        required: false
        default: false
        type: boolean

# main queues instead of cancelling, so edge keeps advancing; see spec/image-pinning.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions: {}

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ${{ vars.AMD_ONLY == '1' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    permissions:
      contents: read
    # The same digest as devcontainer-compose-pins.yml, so the hooks run the tools the
    # image provisions. See spec/pre-commit-gate.
    container:
      image: ghcr.io/plume-works/agentdev-devcontainer:edge@sha256:496c9da122a0b354e14e14d96cd2b6e29c984e743e60faf3c338a87de07ae468
    timeout-minutes: 30
    env:
      # checkout trusts the workspace only within its own step; the container user
      # differs from the workspace owner, so later git calls need it too.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: '*'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select the range
        id: range
        run: scripts/pre-commit-ci-range.py

      - name: uv sync
        run: uv sync --locked

      - name: pre-commit install-hooks
        run: uv run pre-commit install-hooks

      - name: pre-commit run
        env:
          SKIP: no-commit-to-branch
          FROM_REF: ${{ steps.range.outputs.from_ref }}
          TO_REF: ${{ steps.range.outputs.to_ref }}
          ALL_FILES: ${{ steps.range.outputs.all_files }}
          GITLEAKS_LOG_OPTS: ${{ steps.range.outputs.gitleaks_log_opts }}
        run: |
          if [[ "$ALL_FILES" == true ]]; then
            uv run pre-commit run --all-files --show-diff-on-failure
          else
            uv run pre-commit run --from-ref "$FROM_REF" --to-ref "$TO_REF" --show-diff-on-failure
          fi

  ci:
    name: CI/CD
    needs: [pre-commit]
    permissions:
      actions: read
      contents: read
      packages: write
    uses: ./.github/workflows/ci.yml
    with:
      caller_event_name: ${{ github.event_name }}
      clean_build: ${{ github.event_name == 'workflow_dispatch' && inputs.clean_build || false }}
      force_run: ${{ github.event_name == 'workflow_dispatch' }}

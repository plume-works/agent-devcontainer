name: Agent files validation

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  paths-filter:
    name: Need to run?
    runs-on: ${{ vars.AMD_ONLY == '1' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    permissions:
      actions: read
      contents: read
    timeout-minutes: 10
    outputs:
      pass: ${{ steps.filter.outputs.pass }}
    steps:
      - name: Filters
        uses: anton-matosov/actions/paths-filter@v1.0.0
        id: filter
        with:
          filters: |
            - .agents/plugins/**
            - .agents/opencode-bridge/**
            - .claude-plugin/**
            - py_packages/validate_agent_files/**
            - pyproject.toml
            - uv.lock
            # The iwe pin the iwe-bootstrap tests install.
            - scripts/fetch-pinned-tool.py
            - docker/devcontainer/pinned-tools.yml
            # The plugin tests compare the scaffold with these.
            - .iwe
            - docs/knowledge/*
            - docs/knowledge/.*
            - .github/workflows/validate-agent-files.yml
            - .github/actions/setup-python-venv/**
            - .github/actions/log-debug-stats/**

      - name: Log debug stats
        if: ${{ always() }}
        uses: $/.github/actions/log-debug-stats
        with:
          github-token: ${{ github.token }}

  validate-agent-files:
    name: Validate agent files
    runs-on: ubuntu-latest
    needs: paths-filter
    permissions:
      contents: read
    if: needs.paths-filter.outputs.pass == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python venv
        uses: $/.github/actions/setup-python-venv

      - name: Test validate_agent_files
        run: uv run pytest py_packages/validate_agent_files/tests

      # The iwe-bootstrap tests validate the installed scaffold with the image's iwe pin.
      - name: Install the pinned iwe
        run: |
          uv run --frozen scripts/fetch-pinned-tool.py "$RUNNER_TEMP/iwe" iwe
          echo "$RUNNER_TEMP/iwe" >> "$GITHUB_PATH"

      - name: Test the plugin scripts
        run: uv run pytest .agents/plugins/agentdev/tests .agents/plugins/agentdev-iwe/tests

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Test agentdev OpenCode bridge
        run: bun test ./.agents/opencode-bridge/tests

      - name: Validate Agent Files
        run: uv run validate_agent_files --recommend . --require-marketplace claude

      - name: Log debug stats
        if: ${{ always() }}
        uses: $/.github/actions/log-debug-stats
        with:
          github-token: ${{ github.token }}

  # Prepares an unchanged macOS runner with the bootstrap of the catalog.
  macos-bootstrap:
    name: macOS native bootstrap
    runs-on: macos-latest
    needs: paths-filter
    permissions:
      contents: read
    if: needs.paths-filter.outputs.pass == 'true'
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install fish
        run: brew install fish

      # A fish login shell makes the bootstrap write its fish block and check python3 there too.
      - name: Run the bootstrap
        run: SHELL="$(brew --prefix)/bin/fish" /bin/zsh .agents/plugins/agentdev/bin/macos-bootstrap.zsh

      - name: Run a catalog script on the provisioned Python
        run: /bin/zsh -l -c '.agents/plugins/agentdev/skills/git-new-branch/agent-code/git-new-branch.py --help'

      - name: Test the bootstrap
        run: /bin/zsh -l -c 'uv run pytest .agents/plugins/agentdev/tests/test_macos_bootstrap.py'

  finished:
    name: Agent files validation finished
    needs: [paths-filter, validate-agent-files, macos-bootstrap]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    if: always()
    steps:
      - uses: anton-matosov/actions/ci-finished@v1.0.0
        with:
          needs: ${{ toJSON(needs) }}

      - name: Log debug stats
        if: ${{ always() }}
        uses: $/.github/actions/log-debug-stats
        with:
          github-token: ${{ github.token }}

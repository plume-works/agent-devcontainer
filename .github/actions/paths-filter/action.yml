name: Paths filter
description: Report whether the change touches any of the given paths
inputs:
  filters:
    description: Path globs (YAML list entries, one per line)
    required: true
outputs:
  pass:
    description: A changed file matches the filters
    value: ${{ steps.filter.outputs.pass }}
runs:
  using: composite
  steps:
    # A push to main compares against the last commit its workflow passed on: see ADR-0060.
    - name: Find the base commit
      id: shas
      uses: nrwl/nx-set-shas@v5.1.0
      with:
        set-environment-variables-for-job: 'false'

    - name: Filter
      id: filter
      uses: dorny/paths-filter@v4.0.3
      with:
        base: ${{ steps.shas.outputs.base }}
        filters: |
          pass:
          ${{ inputs.filters }}

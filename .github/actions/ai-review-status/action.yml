name: AI review status
description: >-
  Report whether a pull request carries an accepted AI review, evaluated once
  with no waiting. Acceptance policy: see spec/ai-review-gate.

inputs:
  pr-number:
    description: Pull request number to inspect
    required: true
  github-token:
    description: GitHub token used to read reviews
    required: true
  trusted-bot-actors:
    description: >-
      Comma-separated bot logins whose pull requests need no AI review.
      Trust-list policy: see spec/template-consumption.
    required: false
    default: ''

outputs:
  found:
    description: "'true' when the pull request satisfies the acceptance rule"
    value: ${{ steps.check.outputs.found }}
  reason:
    description: One line naming what satisfied the rule, or why nothing did
    value: ${{ steps.check.outputs.reason }}

runs:
  using: composite
  steps:
    - name: Evaluate AI review acceptance
      id: check
      uses: actions/github-script@v9.0.0
      env:
        PR_NUMBER: ${{ inputs.pr-number }}
        TRUSTED_BOT_ACTORS: ${{ inputs.trusted-bot-actors }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const pullRequest = {
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: Number(process.env.PR_NUMBER),
          };
          if (!Number.isInteger(pullRequest.pull_number) || pullRequest.pull_number <= 0) {
            throw new Error(`pr-number must be a positive integer, got ${JSON.stringify(process.env.PR_NUMBER)}`);
          }

          const report = (found, reason) => {
            core.info(reason);
            core.setOutput('found', String(found));
            core.setOutput('reason', reason);
          };

          const trustedBotActors = (process.env.TRUSTED_BOT_ACTORS ?? '')
            .split(',')
            .map((login) => login.trim())
            .filter(Boolean);
          const { data: pr } = await github.rest.pulls.get(pullRequest);
          if (pr.user?.type === 'Bot' && trustedBotActors.includes(pr.user.login)) {
            report(true, `Pull request authored by ${pr.user.login} (bot); AI review is not required.`);
            return;
          }

          // The rule asserts that the PR has been reviewed, not that its
          // current head has been -- see spec/ai-review-gate. Do not compare
          // review.commit_id against the head SHA.
          const claudeLogins = new Set(['claude[bot]', 'github-actions[bot]']);
          const acceptedReviewStates = new Set(['approved', 'changes_requested', 'commented']);

          const reviewLogin = (review) => review?.user?.login;
          const reviewState = (review) => review?.state?.toLowerCase();
          const isClaudeReview = (review) =>
            claudeLogins.has(reviewLogin(review)) && acceptedReviewStates.has(reviewState(review));

          const reviews = await github.paginate(github.rest.pulls.listReviews, {
            ...pullRequest,
            per_page: 100,
          });
          core.info(
            `Observed PR reviews: ${reviews
              .map((review) => `${reviewLogin(review) ?? 'unknown'}:${review.state}:${review.commit_id}`)
              .join(', ') || 'none'}`
          );

          const claudeReview = [...reviews].reverse().find(isClaudeReview);
          if (claudeReview) {
            report(
              true,
              `Found accepted Claude review by ${claudeReview.user.login} for ${claudeReview.commit_id} with state ${claudeReview.state}.`
            );
            return;
          }

          report(
            false,
            'No AI review found. Expected a review from Claude (claude[bot] or github-actions[bot]).'
          );

name: AI review status
description: >-
  Report whether a pull request carries an accepted AI review. Examine
  the pull request one time, without a wait.

inputs:
  pr-number:
    description: Pull request number to inspect
    required: true
  github-token:
    description: GitHub token used to read reviews
    required: true
  trusted-bot-actors:
    description: >-
      Comma-separated bot logins whose pull requests need no AI review.
      Trust-list policy: see ADR-0037.
    required: false
    default: ''

outputs:
  found:
    description: "'true' when the pull request satisfies the acceptance rule"
    value: ${{ steps.check.outputs.found }}
  reason:
    description: One line naming what satisfied the rule, or why nothing did
    value: ${{ steps.check.outputs.reason }}

runs:
  using: composite
  steps:
    - name: Read the pull request and its reviews
      id: facts
      uses: actions/github-script@v9.0.0
      env:
        PR_NUMBER: ${{ inputs.pr-number }}
        TRUSTED_BOT_ACTORS: ${{ inputs.trusted-bot-actors }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const pullRequest = {
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: Number(process.env.PR_NUMBER),
          };
          if (!Number.isInteger(pullRequest.pull_number) || pullRequest.pull_number <= 0) {
            throw new Error(`pr-number must be a positive integer, got ${JSON.stringify(process.env.PR_NUMBER)}`);
          }

          const { data: pr } = await github.rest.pulls.get(pullRequest);
          const reviews = await github.paginate(github.rest.pulls.listReviews, {
            ...pullRequest,
            per_page: 100,
          });
          core.info(
            `Observed PR reviews: ${reviews
              .map((review) => `${review?.user?.login ?? 'unknown'}:${review.state}:${review.commit_id}`)
              .join(', ') || 'none'}`
          );
          core.setOutput('facts', JSON.stringify({
            author: { login: pr.user?.login, type: pr.user?.type },
            trusted_bots: process.env.TRUSTED_BOT_ACTORS ?? '',
            reviews: reviews.map((review) => ({
              login: review?.user?.login,
              state: review?.state,
              commit_id: review?.commit_id,
            })),
          }));

    - name: Evaluate AI review acceptance
      id: check
      uses: $/.github/actions/ai-review-gate
      with:
        decision: review-accepted
        facts: ${{ steps.facts.outputs.facts }}

name: Setup Python venv
description:
  Provision Python, uv, and a synced project environment. The environment is NOT activated — callers
  must invoke project tools through `uv run`.

inputs:
  python-version:
    description: Python version to use
    required: false
    default: '3.12'

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v7
      id: setup-python
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        version: '0.12.9'
        # uv owns environment creation, so caching its package cache is the
        # equivalent of caching the environment directory -- and stays correct
        # across interpreter and lockfile changes.
        enable-cache: true

    # `--locked` fails here on lockfile drift. `--frozen` skips the currency
    # check entirely, letting a dependency that is in pyproject.toml but not in
    # uv.lock through provisioning, to be installed later by a bare `uv run`.
    - name: Install dependencies
      run: uv sync --locked --all-groups --all-extras
      shell: bash
      env:
        # Bind uv to the interpreter actions/setup-python installed, instead of
        # resolving or downloading one of its own. Without this uv selects it
        # only incidentally, by finding a matching system Python on PATH.
        UV_PYTHON_PREFERENCE: only-system

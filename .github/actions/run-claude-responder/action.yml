name: Run Claude responder
description: Prepare the CI agent environment and run the Claude responder action.

inputs:
  artifact-name:
    description: Name for the responder execution artifact.
    required: true
  claude-code-oauth-token:
    description: OAuth token for the Claude Code action.
    required: true
  github_token:
    description: GitHub token passed to the Claude Code action.
    required: true
  prompt:
    description: Prompt for the Claude responder.
    required: true
  model:
    description: >-
      Model for the responder session; empty keeps the model the merged
      settings pin.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # See docs/knowledge/data/architecture/ci-agent-plugin-availability.md.
    - name: Run devcontainer lifecycle commands
      shell: bash
      env:
        DEV_WORKSPACE_FOLDER: ${{ github.workspace }}
        AGENTDEV_SKIP_PRE_COMMIT: '1'
        AGENTDEV_SKIP_XPRA: '1'
        AGENTDEV_SKIP_CLAUDE_PREAPPROVE: '1'
        UV_PROJECT_ENVIRONMENT: /opt/ci-venv
      run: |
        mkdir -p /root/.claude
        # A pinned image built before the runtime package lacks the CLI. The build
        # runs on a copy so its build/ tree stays out of the reviewed checkout.
        if ! command -v agentdev-runtime >/dev/null; then
          src="$(mktemp -d)"
          cp -r "$GITHUB_WORKSPACE/py_packages/agentdev_runtime/." "$src"
          UV_TOOL_DIR=/opt/uv-tools UV_TOOL_BIN_DIR=/usr/local/bin UV_PYTHON_DOWNLOADS=never \
            uv tool install --python /usr/bin/python3 "$src"
        fi
        agentdev-runtime lifecycle created
        # No supervisor runs in a container job: run the per-start repairs directly.
        agentdev-runtime lifecycle ready --no-wait
        agentdev-runtime lifecycle attached

    # claude-code-action merges its settings input into the user settings one
    # level deep, so the hook-written user layer rides underneath here or its
    # enabledPlugins is replaced wholesale.
    - name: Merge Claude settings
      id: claude_settings
      shell: bash
      run: |
        layers=()
        if [[ -f "${HOME}/.claude/settings.json" ]]; then
          layers+=("${HOME}/.claude/settings.json")
        fi
        layers+=(.claude/settings.json)
        if [[ -f .claude/settings.local.json ]]; then
          layers+=(.claude/settings.local.json)
        fi
        merged=$(jq -cs 'reduce .[] as $layer ({}; . * $layer)' "${layers[@]}")
        {
          echo 'json<<CLAUDE_SETTINGS_EOF'
          echo "$merged"
          echo 'CLAUDE_SETTINGS_EOF'
        } >>"$GITHUB_OUTPUT"

    # claude_args is one string that several inputs contribute to; each flag
    # appends to it so another can be added without re-deriving the rest.
    - name: Compose Claude arguments
      id: claude_args
      shell: bash
      env:
        ALLOWED_TOOLS: ${{ env.CLAUDE_PR_REVIEW_ARGS }}
        MODEL: ${{ inputs.model }}
      run: |
        args="--allowedTools '${ALLOWED_TOOLS}'"
        if [[ -n "${MODEL}" ]]; then
          args="${args} --model '${MODEL}'"
        fi
        printf 'args=%s\n' "${args}" >>"${GITHUB_OUTPUT}"

    - name: Claude Responder
      id: claude_responder
      uses: anthropics/claude-code-action@v1
      with:
        claude_code_oauth_token: ${{ inputs.claude-code-oauth-token }}
        github_token: ${{ inputs.github_token }}
        settings: ${{ steps.claude_settings.outputs.json }}
        claude_args: ${{ steps.claude_args.outputs.args }}
        assignee_trigger: 'claude-bot'
        show_full_output: true
        prompt: ${{ inputs.prompt }}

    - name: Attach responder output file
      if: always() && steps.claude_responder.outputs.execution_file != ''
      uses: actions/upload-artifact@v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.claude_responder.outputs.execution_file }}
        retention-days: 7

    - name: Fail on Claude usage limit
      if: always() && steps.claude_responder.outputs.execution_file != ''
      shell: bash
      env:
        EXECUTION_FILE: ${{ steps.claude_responder.outputs.execution_file }}
      run: |
        if jq --exit-status '
          any(
            .[]?
            | select(
                .type? == "assistant"
                and .message.type? == "message"
                and .message.role? == "assistant"
              )
            | .message.content[]?
            | select(
                .type? == "text"
                and (.text? | contains("You'\''ve hit your org'\''s monthly spend limit"))
              );
            true
          )
        ' "$EXECUTION_FILE" >/dev/null; then
          echo "::error::Claude hit the organization's monthly spend limit."
          exit 1
        fi

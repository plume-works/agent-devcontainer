# Every hook runs a tool with one version owner: uv.lock (`uv run`), the image's
# dev_tools_pinned_tools binaries, or a `bunx <package>@<version>` pin. No hook
# names a remote repository, so `pre-commit install-hooks` builds nothing.
repos:
  - repo: local
    hooks:
      - id: end-of-file-fixer
        name: fix end of files
        entry: uv run end-of-file-fixer
        language: system
        types: [text]
        stages: [pre-commit, pre-push, manual]

      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: uv run trailing-whitespace-fixer
        language: system
        types: [text]
        stages: [pre-commit, pre-push, manual]

      - id: check-merge-conflict
        name: check for merge conflicts
        entry: uv run check-merge-conflict
        language: system
        types: [text]

      - id: mixed-line-ending
        name: mixed line ending
        entry: uv run mixed-line-ending
        language: system
        types: [text]
        args: [--fix=lf]

      # Work lands through pull requests; see spec/git-new-branch.
      - id: no-commit-to-branch
        name: don't commit to branch
        entry: uv run no-commit-to-branch
        language: system
        pass_filenames: false
        always_run: true
        args: [--branch, main, --branch, master]

      - id: clang-format
        name: clang-format
        entry: uv run clang-format -i
        language: system
        types_or: [c, c++]
        files: '\.(c|cc|cpp|cxx|h|hh|hpp|hxx)$'
        args: [-style=file]

      # The repository root: ansible.cfg lives there, so that is where the
      # inventory and roles paths resolve from.
      - id: ansible-lint
        name: ansible-lint
        entry: uv run ansible-lint -v --force-color
        language: system
        files: '^ansible/.*\.ya?ml$'
        args: ['--project-dir=.']
        pass_filenames: true
        always_run: false

      - id: hadolint-docker
        name: Lint Dockerfiles
        entry: hadolint
        language: system
        types: [dockerfile]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

      # `I` (isort) is in .ruff.toml's select list, so this single pass also
      # sorts imports.
      - id: ruff
        name: ruff (legacy alias)
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        args: [--fix]
        require_serial: true

      # shellcheck cannot parse zsh; the macOS bootstrap is checked with `zsh -n`.
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
        exclude: '^\.agents/plugins/agentdev/bin/macos-bootstrap\.zsh$'
        require_serial: true

      # Scans GITLEAKS_LOG_OPTS when set (CI), the pushed range at pre-push, and the
      # staged change otherwise; see spec/pre-commit-gate.
      - id: gitleaks
        name: Detect hardcoded secrets
        entry: >-
          bash -c 'if [ -n "${GITLEAKS_LOG_OPTS:-}" ]; then
          exec gitleaks git --redact --verbose --log-opts="$GITLEAKS_LOG_OPTS";
          elif [ -n "${PRE_COMMIT_FROM_REF:-}" ] && [ -n "${PRE_COMMIT_TO_REF:-}" ]; then
          exec gitleaks git --redact --verbose
          --log-opts="$PRE_COMMIT_FROM_REF..$PRE_COMMIT_TO_REF";
          else exec gitleaks git --pre-commit --redact --staged --verbose; fi'
        language: system
        pass_filenames: false
        # A range can leave no changed file behind; the scan reads commits, not files.
        always_run: true

      - id: actionlint
        name: Lint GitHub Actions workflow files
        entry: actionlint
        language: system
        types: [yaml]
        files: '^\.github/workflows/'

      # language: system + bunx: pre-commit's language: node installs hook envs with npm.
      # .prettierignore still applies.
      - id: prettier
        name: prettier
        entry: bunx prettier@3.8.4 --write --ignore-unknown
        language: system
        files: '\.(md|markdown|ya?ml|json|jsonc)$'

      # Both flags, and why this pin is also the bot's and the workflow's
      # Renovate version: see architecture/renovate-config-validation.
      - id: renovate-config-validator
        name: renovate-config-validator
        entry: bunx --package renovate@44.199.2 renovate-config-validator --no-global --strict
        language: system
        files: '^\.github/renovate\.json$'

      - id: zizmor
        name: zizmor
        entry: zizmor
        language: system
        files: '^\.github/(actions|workflows)/.*\.ya?ml$'

      # `uv run` on purpose. The agentdev images also ship a
      # `validate_agent_files` on PATH, and that is what a consuming project
      # should call (see docs/knowledge/data/spec/template-consumption.md),
      # but the publisher must validate against the working-tree source it is
      # editing rather than the copy frozen into the image.
      - id: validate-agent-files
        name: validate-agent-files
        entry: uv run validate_agent_files
        language: system
        files: '(\.agents/plugins/agentdev/skills/.*/SKILL\.md|\.agents/plugins/agentdev/agents/.*\.agent\.md)$'
        pass_filenames: true

      # `uv run` for the same reason as validate-agent-files above: the gate
      # must read the working-tree plans being committed. It audits the whole
      # plans directory rather than the staged subset, so it takes no filenames.
      - id: plan-checkboxes
        name: plan-checkboxes
        entry: uv run pytest docs/knowledge/tests/test_plan_checkboxes.py
        language: system
        files: '^docs/knowledge/data/plans/.*\.md$'
        pass_filenames: false

      # Mirrors the Knowledge base validation workflow. Hooks read the whole graph
      # from the repo root, so they take no filenames and trigger on any
      # graph-affecting change under docs/knowledge/ or .iwe/.
      - id: iwe-schema-validate
        name: iwe-schema-validate
        entry: iwe schema validate
        language: system
        files: '^(docs/knowledge/.*\.md|\.iwe/.*)$'
        pass_filenames: false

      # normalize rewrites files in place and returns 0 even after changing files;
      # git diff --exit-code turns drift into failure while leaving normalized files
      # staged-out for review and re-add, matching CI's no-op check.
      - id: iwe-normalize
        name: iwe-normalize
        entry: bash -c 'iwe normalize && git diff --exit-code'
        language: system
        files: '^(docs/knowledge/.*\.md|\.iwe/.*)$'
        pass_filenames: false

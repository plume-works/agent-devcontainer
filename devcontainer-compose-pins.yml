# Digest pins for the container images this repository builds and publishes.
#
# Deliberately kept at the repository root, outside .devcontainer/ and docker/, so that a
# digest-only bump does not match the `image` path filter in
# .github/actions/paths-filter/action.yml. Those images are rebuilt on every push to main
# and the build is not bit-reproducible, so a pin living inside a filtered path would
# retrigger the build that produced the digest and bump itself forever.
#
# Renovate manages the digest below through `.github/renovate.json`;
# .devcontainer/docker-compose.yml carries the image tag-only, and
# this file overrides it through `dockerComposeFile` in devcontainer.json.
services:
  devcontainer:
    image: ghcr.io/plume-works/agentdev-devcontainer:edge@sha256:69e9acae5ec6b36dd51e52328dcb4b0aa67de77b9fa9edf577f6b70060dfdb2f

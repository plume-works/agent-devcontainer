[project]
name = "agent-devcontainer"
version = "0.0.0"
requires-python = ">=3.12"
description = "General-purpose agent development container: image build, devcontainer template, and agent catalog."

[dependency-groups]
dev = [
  "pre-commit>=4.2.0",
  "ansible>=11.4",
  "ansible-lint>=25.2.1",
  "clang-format>=21.1.2",
  "pre-commit-hooks>=6.0.0",
  "pytest>=7.0.0",
  "pytest-cov>=7.0.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.11.5",
  "pydantic>=2.0",
  "python-frontmatter>=1.1.0",
  "agentdev-lib",
  "agentdev_runtime",
  "validate_agent_files",
  "json5>=0.17.3",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.sources]
agentdev-lib = { path = "py_packages/agentdev_lib", editable = true }
agentdev_runtime = { path = "py_packages/agentdev_runtime", editable = true }
validate_agent_files = { path = "py_packages/validate_agent_files", editable = true }

[tool.pytest.ini_options]
testpaths = [
  ".agents/plugins/agentdev/tests",
  "docs/knowledge/tests",
  "py_packages",
  "scripts/tests",
]
addopts = "-m 'not stress'"
markers = [
  "stress: repeats a race many times; excluded by default and run by a separate step of the CI Devcontainer image job with `-m stress -n auto`",
  "requires_root: needs root (supervisord switching users, chown to other UIDs); skipped otherwise and run as root by scripts/run-root-tests",
]

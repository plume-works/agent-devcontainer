; supervisord as PID 1 for agentdev-devcontainer, run in-process by agentdev-runtime supervisor run.
; The controller event listener owns ordering, readiness, and recovery; create-, start-,
; and attach-scoped work stays in the image's lifecycle commands. Spec: agentdev-runtime-images.
; Shutdown stops groups from the highest priority down.

[unix_http_server]
file=/run/agentdev/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/agentdev/supervisord.pid
childlogdir=/run/agentdev

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/agentdev/supervisor.sock

[eventlistener:controller]
command=/usr/local/bin/agentdev-runtime supervisor control
events=PROCESS_STATE
buffer_size=100
priority=999
autostart=true
autorestart=false
startsecs=0
startretries=0
stdout_logfile=NONE
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:dockerd]
command=/usr/local/bin/agentdev-runtime supervisor exec dockerd /usr/local/bin/agentdev-runtime docker run
priority=10
autostart=false
autorestart=false
startsecs=0
startretries=0
stopasgroup=true
killasgroup=true
stopwaitsecs=%(ENV_AGENTDEV_STOP_TIMEOUT)s
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:dbus]
command=/usr/local/bin/agentdev-runtime supervisor exec dbus /usr/local/bin/agentdev-runtime keyring dbus
priority=20
user=%(ENV_AGENTDEV_USER)s
environment=HOME="%(ENV_AGENTDEV_HOME)s",USER="%(ENV_AGENTDEV_USER)s",LOGNAME="%(ENV_AGENTDEV_USER)s"
autostart=false
autorestart=false
startsecs=0
startretries=0
stopasgroup=true
killasgroup=true
stopwaitsecs=%(ENV_AGENTDEV_STOP_TIMEOUT)s
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:keyring]

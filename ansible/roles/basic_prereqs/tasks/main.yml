---
- name: Load pinned apt versions
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/apt_pins_{{ system_dist }}_{{ system_arch }}.yml"

# The package set is in vars/apt_pins_<suite>_<arch>.yml. The three entries that
# are not self-explanatory: openssh-server lets GitHub Codespaces (and the
# remote-codespace-session skill's `gh codespace ssh`) start an SSH server in
# the container, with the devcontainers/features/sshd feature configuring it;
# rsync is needed on the remote end for that skill's dirty-tree sync path
# (`rsync -e ssh ...`), which requires it on both ends; and dbus-x11,
# gnome-keyring and libsecret-1-0 are the GNOME Keyring Secret Service stack
# that .devcontainer/scripts/setup-keyring.sh brings up as a headless
# org.freedesktop.secrets so `gh auth login` has somewhere to persist its token.
- name: Install basic prerequisites
  ansible.builtin.apt:
    name: "{{ basic_prereqs_apt_pins.items() | map('join', '=') | list }}"
    state: present
    update_cache: true
    install_recommends: false

- name: Enable community-maintained free and open-source software (universe repository)
  # ansible.builtin.apt_repository: doesn't support repo short names
  # Request to fix that was closed as "Won't do" https://github.com/ansible/ansible/issues/48714
  # The code below is a workaround, the commented out version works as well,
  # but it creates a duplicate entry conflicting with /etc/apt/sources.list.d/ubuntu.sources
  #
  # Possible future improvement if ever needed is to do a dry-run and check if the entry already exists
  # sudo add-apt-repository universe --dry-run
  # Adding component(s) 'universe' to all repositories.
  # DRY-RUN mode: no modifications will be made
  #
  become: true
  ansible.builtin.command: add-apt-repository universe
  changed_when: true


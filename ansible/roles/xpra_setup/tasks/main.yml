---
- name: Install Xpra and related packages
  block:
    - name: Detect system architecture for the Xpra repository
      ansible.builtin.set_fact:
        xpra_setup_arch: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"

    - name: Add Xpra signing key
      ansible.builtin.get_url:
        url: https://xpra.org/xpra.asc
        dest: /usr/share/keyrings/xpra.asc
        mode: "0644"

    - name: Add Xpra stable repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ xpra_setup_arch }} signed-by=/usr/share/keyrings/xpra.asc]
          https://xpra.org {{ ansible_facts['distribution_release'] | lower }} main
        state: present
        filename: xpra
        update_cache: true

    - name: Install Xpra server package
      ansible.builtin.apt:
        name:
          - xpra
        state: present
        install_recommends: true

    # A reused base image already holds Ubuntu's xpra 3.x, which present leaves alone.
    - name: Upgrade Xpra to the repository's release
      ansible.builtin.apt:
        name:
          - xpra
        state: latest
        only_upgrade: true
        install_recommends: true

    # Ubuntu's archive also ships an xpra (3.x); fail if apt resolved that one.
    - name: Read the installed Xpra version
      ansible.builtin.command:
        cmd: dpkg-query -W -f=${Version} xpra
      register: xpra_setup_installed
      changed_when: false

    - name: Require Xpra 6 or newer from the Xpra repository
      ansible.builtin.assert:
        that: xpra_setup_installed.stdout is version('6', '>=')
        fail_msg: "xpra {{ xpra_setup_installed.stdout }} is not from the Xpra 6.x repository"

    - name: Clone Xpra-html5 repository (pinned to v19 tag)
      ansible.builtin.git:
        repo: https://github.com/Xpra-org/xpra-html5.git
        dest: /tmp/xpra-html5
        version: 462cadec215acd1bb7d2d8fdc58d5040a0412540
        depth: 1

    - name: Install Xpra-html5 repository using setup.py
      ansible.builtin.command:
        cmd: python3 /tmp/xpra-html5/setup.py install
        creates: /etc/apt/sources.list.d/xpra-html5.list

    - name: Clean up Xpra-html5 repository clone
      ansible.builtin.file:
        path: /tmp/xpra-html5
        state: absent

    - name: Install VirtualGL from GitHub releases
      block:
        - name: Detect system architecture for VirtualGL
          ansible.builtin.set_fact:
            xpra_setup_virtualgl_arch: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"

        - name: Download VirtualGL DEB package
          ansible.builtin.get_url:
            url: "{{ xpra_setup_virtualgl_download_url }}"
            dest: "/tmp/virtualgl_{{ xpra_setup_virtualgl_version }}_{{ xpra_setup_virtualgl_arch }}.deb"
            checksum: "{{ xpra_setup_virtualgl_checksums[xpra_setup_virtualgl_arch] }}"
            mode: "0644"

        - name: Install VirtualGL DEB package
          ansible.builtin.apt:
            deb: "/tmp/virtualgl_{{ xpra_setup_virtualgl_version }}_{{ xpra_setup_virtualgl_arch }}.deb"
            state: present

        - name: Clean up VirtualGL DEB file
          ansible.builtin.file:
            path: "/tmp/virtualgl_{{ xpra_setup_virtualgl_version }}_{{ xpra_setup_virtualgl_arch }}.deb"
            state: absent

    - name: Install Mesa and OpenGL support packages
      ansible.builtin.apt:
        name:
          - mesa-utils
          - menu-xdg
          - python3-opengl
          - python3-pyinotify
          - python3-xdg
          - libgl1
          - libglvnd0
          - xvfb
        state: present
        install_recommends: false

    - name: Install software rendering support (Mesa DRI with llvmpipe)
      ansible.builtin.apt:
        name:
          - libgl1-mesa-dri
        state: present
        install_recommends: false

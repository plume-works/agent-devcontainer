---
# Development tools installation
- name: Load pinned apt versions
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/apt_pins_{{ system_dist }}_{{ system_arch }}.yml"

- name: Add Git Core PPA
  ansible.builtin.apt_repository:
    repo: ppa:git-core/ppa
    state: present
    filename: git-core-ppa

# The package set is in vars/apt_pins_<suite>_<arch>.yml; ffmpeg is there for
# rendering animations and screen captures, btop for monitoring resource usage.
# cmake resolves from the Kitware repository that cmake_kitware adds before this
# role runs, and git and git-lfs from the git-core PPA added above.
- name: Install development tools
  ansible.builtin.apt:
    name: "{{ dev_tools_apt_pins.items() | map('join', '=') | list }}"
    state: present
    install_recommends: false
    update_cache: true

- name: Install pinned single-binary tools
  ansible.builtin.include_tasks: install_pinned_tool.yml
  loop: "{{ dev_tools_pinned_tools }}"
  loop_control:
    loop_var: dev_tools_tool
    label: "{{ dev_tools_tool.name }}"

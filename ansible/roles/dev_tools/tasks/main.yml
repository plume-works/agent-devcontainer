---
# Development tools installation
- name: Add Git Core PPA
  ansible.builtin.apt_repository:
    repo: ppa:git-core/ppa
    state: present
    filename: git-core-ppa

- name: Install development tools
  ansible.builtin.apt:
    name:
      - bash-completion
      - build-essential
      - cmake
      - dirmngr
      - git
      - git-lfs
      - gnupg2
      - jq
      - ninja-build
      - pkg-config
      - pre-commit
      - python3-argcomplete
      - python3-pip
      - python3-setuptools
      - python3-venv
      - python3-toml # for configuring .codex
      - shellcheck
      - ffmpeg # for rendering animations and screen captures
      - btop # for monitoring resource usage in development
    state: present
    install_recommends: false
    update_cache: true

- name: Install pinned single-binary tools
  ansible.builtin.include_tasks: install_pinned_tool.yml
  loop: "{{ dev_tools_pinned_tools }}"
  loop_control:
    loop_var: dev_tools_tool
    label: "{{ dev_tools_tool.name }}"

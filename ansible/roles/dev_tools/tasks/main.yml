---
# Development tools installation
- name: Load pinned apt versions
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/apt_pins_{{ system_dist }}_{{ system_arch }}.yml"

- name: Add Git Core PPA
  ansible.builtin.apt_repository:
    repo: ppa:git-core/ppa
    state: present
    filename: git-core-ppa

# Package set: vars/apt_pins_<suite>_<arch>.yml (ffmpeg renders animations and
# screen captures, btop monitors resource usage). cmake resolves from the
# Kitware repository cmake_kitware adds, git and git-lfs from the PPA above.
- name: Install development tools
  ansible.builtin.apt:
    name: "{{ dev_tools_apt_pins.items() | map('join', '=') | list }}"
    allow_downgrade: true
    state: present
    install_recommends: false
    update_cache: true

- name: Install pinned single-binary tools
  ansible.builtin.include_tasks: install_pinned_tool.yml
  loop: "{{ dev_tools_pinned_tools }}"
  loop_control:
    loop_var: dev_tools_tool
    label: "{{ dev_tools_tool.name }}"

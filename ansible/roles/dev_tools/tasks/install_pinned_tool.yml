---
# Install one entry from dev_tools_pinned_tools; `dev_tools_tool` is the loop
# item main.yml passes. Installs every name in `dev_tools_tool.binaries` when
# the archive ships more than one (see iwe), otherwise just its `name`.
- name: "Ensure the current architecture is supported: {{ dev_tools_tool.name }}"
  ansible.builtin.assert:
    that: system_arch in dev_tools_tool.archives
    fail_msg: "{{ dev_tools_tool.name }} is not available for architecture {{ system_arch }}"

# `extension` defaults to tar.gz; `binaries_in_asset_dir` says the archive
# unpacks into a directory named after the asset rather than laying its
# binaries out flat (see bun).
- name: "Resolve the archive layout: {{ dev_tools_tool.name }}"
  ansible.builtin.set_fact:
    dev_tools_tool_asset: >-
      {{ dev_tools_tool.asset_prefix | replace('{version}', dev_tools_tool.version)
      }}{{ dev_tools_tool.archives[system_arch].target }}
    dev_tools_tool_extension: "{{ dev_tools_tool.extension | default('tar.gz') }}"

- name: "Resolve the binary location: {{ dev_tools_tool.name }}"
  ansible.builtin.set_fact:
    dev_tools_tool_binary_dir: >-
      {{ (dev_tools_tool_asset ~ '/') if dev_tools_tool.binaries_in_asset_dir | default(false) else '' }}

- name: "Create temporary directory: {{ dev_tools_tool.name }}"
  ansible.builtin.tempfile:
    state: directory
  register: dev_tools_tool_temp_dir

- name: "Download archive: {{ dev_tools_tool.name }}"
  ansible.builtin.get_url:
    url: >-
      {{ dev_tools_tool.url_prefix }}/{{ dev_tools_tool.version }}/{{
         dev_tools_tool_asset }}.{{ dev_tools_tool_extension }}
    dest: "{{ dev_tools_tool_temp_dir.path }}/{{ dev_tools_tool.name }}.{{ dev_tools_tool_extension }}"
    checksum: "sha256:{{ dev_tools_tool.archives[system_arch].checksum }}"
    mode: "0644"

- name: "Extract archive: {{ dev_tools_tool.name }}"
  ansible.builtin.unarchive:
    src: "{{ dev_tools_tool_temp_dir.path }}/{{ dev_tools_tool.name }}.{{ dev_tools_tool_extension }}"
    dest: "{{ dev_tools_tool_temp_dir.path }}"
    remote_src: true

- name: "Install binaries: {{ dev_tools_tool.name }}"
  ansible.builtin.copy:
    src: "{{ dev_tools_tool_temp_dir.path }}/{{ dev_tools_tool_binary_dir }}{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  loop: "{{ dev_tools_tool.binaries | default([dev_tools_tool.name]) }}"

- name: "Clean up temporary files: {{ dev_tools_tool.name }}"
  ansible.builtin.file:
    path: "{{ dev_tools_tool_temp_dir.path }}"
    state: absent

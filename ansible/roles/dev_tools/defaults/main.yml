---
# Pinned single-binary tools, each released per arch as an archive or a bare
# binary. Every entry is downloaded, checksum-verified, extracted (archives only)
# to a scratch tempdir, and only the named binary is copied out to /usr/local/bin/<name> as root:root — the archive
# itself is never unpacked directly into /usr/local/bin, so an unrelated owner
# baked into the archive's own "./" entry (see zizmor below) can never leak onto
# a shared system directory.
#
# The download URL is assembled as
# "{{ url_prefix }}/{{ version }}/{{ asset_prefix }}{{ archives[system_arch].target }}.<extension>",
# with any `{version}` in `asset_prefix` replaced by `version`, and any `{bare_version}`
# by `version` without its leading `v`, so a bump edits one field.
# Add an entry here (plus a checksum pair per architecture) to pin a new tool.
# Set `binaries` when a tarball ships more than one binary to install (see iwe);
# it defaults to a single-element list containing `name`.
# A `# renovate:` comment above an entry's `version` lets Renovate bump it; the
# post-upgrade script then recomputes its checksums.
dev_tools_pinned_tools:
  - name: zizmor
    # renovate: datasource=github-releases depName=zizmorcore/zizmor
    version: v1.31.1
    url_prefix: https://github.com/zizmorcore/zizmor/releases/download
    asset_prefix: zizmor-
    archives:
      amd64:
        target: x86_64-unknown-linux-gnu
        checksum: d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99
      arm64:
        target: aarch64-unknown-linux-gnu
        checksum: 37eebbd5762a44f262d94875431b14a6d2402991e90a685113ea97b8b41be833

  # Run by the gitleaks and actionlint pre-commit hooks, so a hook needs no Go toolchain.
  - name: gitleaks
    # renovate: datasource=github-releases depName=gitleaks/gitleaks
    version: v8.30.1
    url_prefix: https://github.com/gitleaks/gitleaks/releases/download
    asset_prefix: "gitleaks_{bare_version}_"
    archives:
      amd64:
        target: linux_x64
        checksum: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      arm64:
        target: linux_arm64
        checksum: e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080

  - name: actionlint
    # renovate: datasource=github-releases depName=kjanat/actionlint
    version: v1.17.0
    url_prefix: https://github.com/kjanat/actionlint/releases/download
    asset_prefix: "actionlint_{bare_version}_"
    archives:
      amd64:
        target: linux_amd64
        checksum: 620abd485a12b6ab1125b844a876414e1d5bd2af8a3125b27f82b01d0d9d6e5a
      arm64:
        target: linux_arm64
        checksum: 9be067d6b6e2f455fd0144850520b4b1114a0a792ca6e003302c939792589345

  # Run by the hadolint and shellcheck pre-commit hooks.
  - name: hadolint
    # renovate: datasource=github-releases depName=hadolint/hadolint
    version: v2.15.1
    url_prefix: https://github.com/hadolint/hadolint/releases/download
    asset_prefix: hadolint-linux-
    bare_binary: true
    archives:
      amd64:
        target: x86_64
        checksum: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
      arm64:
        target: arm64
        checksum: f6198ef8090f404dbb771abfee086eb8c48ac177f30da7fd3510aca35b344b5d

  - name: shellcheck
    # renovate: datasource=github-releases depName=koalaman/shellcheck
    version: v0.11.0
    url_prefix: https://github.com/koalaman/shellcheck/releases/download
    asset_prefix: "shellcheck-{version}.linux."
    extension: tar.xz
    binaries_dir: "shellcheck-{version}"
    archives:
      amd64:
        target: x86_64
        checksum: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
      arm64:
        target: aarch64
        checksum: 12b331c1d2db6b9eb13cfca64306b1b157a86eb69db83023e261eaa7e7c14588

  # The tarball also ships iwec, the MCP server, which no agent config registers.
  - name: iwe
    # renovate: datasource=github-releases depName=iwe-org/iwe versioning=regex:^iwe-v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$
    version: iwe-v0.29.3
    url_prefix: https://github.com/iwe-org/iwe/releases/download
    asset_prefix: "{version}-"
    binaries: [iwe, iwes]
    archives:
      amd64:
        target: x86_64-unknown-linux-gnu
        checksum: f8ddea58a0114dc2e3d3a2ad212be455ac3b7091bdc73bbb3a6c9d97ae6ab856
      arm64:
        target: aarch64-unknown-linux-gnu
        checksum: c50bafd3526103598cde298944cc9909d2187882ba3db5d57a08b901a1a933ff

  # codebase-memory-mcp ships a per-OS/arch archive containing the binary plus its
  # own install.sh. That installer re-downloads from GitHub's "latest" alias even
  # when run from an already-extracted archive, which floats the pinned version —
  # so this role downloads and verifies the archive itself and unpacks only the
  # binary. Linux always needs the "-portable" (fully static) variant: the plain
  # linux build dynamically links glibc 2.38+ and fails on older bases (Debian 11,
  # Ubuntu 20.04) this image's roles target elsewhere.
  # Agent config wiring (`codebase-memory-mcp install`) is deliberately left to
  # container-create time (see `agentdev-runtime lifecycle created`),
  # because it writes into ~/.claude.json, which a persistent volume
  # mounts over anything written at image-build time — the same reason
  # agentic_tools only stages its catalog at build time instead of installing it.
  - name: codebase-memory-mcp
    # renovate: datasource=github-releases depName=DeusData/codebase-memory-mcp
    version: v0.12.1
    url_prefix: https://github.com/DeusData/codebase-memory-mcp/releases/download
    asset_prefix: codebase-memory-mcp-
    archives:
      amd64:
        target: linux-amd64-portable
        checksum: 8c3d0341064301e78ecc84cf7348d4e2c6562a0f57448243ea560aaa34de36c1
      arm64:
        target: linux-arm64-portable
        checksum: ed0f1f548cd79b121c401c2e9f7841c189a001af26d3768368088c24f6a53533

  # Bun's .zip holds its binary under a directory named after the asset, hence
  # `extension` and `binaries_in_asset_dir`. The amd64 asset is `-baseline`,
  # which runs without AVX2; plain `x64` faults on a host that lacks it.
  - name: bun
    # renovate: datasource=github-releases depName=oven-sh/bun versioning=regex:^bun-v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$
    version: bun-v1.4.4
    url_prefix: https://github.com/oven-sh/bun/releases/download
    asset_prefix: bun-linux-
    extension: zip
    binaries_in_asset_dir: true
    archives:
      amd64:
        target: x64-baseline
        checksum: e0446eb55995772eb9894bebae9a6be368d985a8b9271ee124486f9946eedd76
      arm64:
        target: aarch64
        checksum: baa6bb36f51d6e58561e02bbea825038a9df454f673d6d776e8bbf86f8c7850e

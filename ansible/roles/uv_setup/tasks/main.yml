---
# Install uv Python package manager from the official installer
- name: Read the installed uv version
  ansible.builtin.command:
    argv:
      - /usr/local/bin/uv
      - --version
  register: uv_setup_installed_version
  changed_when: false
  failed_when: false

# `uv --version` reports "uv <version> (<commit> <date>)"; only the version is
# compared. Guards on the pinned version rather than on the binary's existence,
# so that bumping uv_setup_version reinstalls instead of keeping the old uv.
- name: Decide whether uv needs installing
  ansible.builtin.set_fact:
    uv_setup_install_needed: >-
      {{ uv_setup_installed_version.rc != 0
         or (uv_setup_installed_version.stdout.split()[1:2] | join('')) != uv_setup_version }}

- name: Create temporary directory for uv installer
  ansible.builtin.tempfile:
    state: directory
  register: uv_setup_temp_dir
  when: uv_setup_install_needed | bool

- name: Download uv install script
  ansible.builtin.get_url:
    url: "https://astral.sh/uv/{{ uv_setup_version }}/install.sh"
    dest: "{{ uv_setup_temp_dir.path }}/uv-install.sh"
    mode: "0755"
  when: uv_setup_install_needed | bool

- name: Install uv to /usr/local/bin
  ansible.builtin.shell:
    cmd: "{{ uv_setup_temp_dir.path }}/uv-install.sh"
    executable: /bin/sh
  environment:
    UV_INSTALL_DIR: /usr/local/bin
    UV_NO_MODIFY_PATH: "1"
  changed_when: true
  when: uv_setup_install_needed | bool

- name: Clean up temporary directory
  ansible.builtin.file:
    path: "{{ uv_setup_temp_dir.path }}"
    state: absent
  when: uv_setup_install_needed | bool and uv_setup_temp_dir.path is defined

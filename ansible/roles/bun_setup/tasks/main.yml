---
# Bun's binary is installed by dev_tools, which pins it by version and
# per-architecture checksum like every other release artifact it fetches. This
# role owns the user-facing setup around it: the bunx alias, the global bin
# directory, and the shell PATH wiring.
- name: Check if bunx is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/bunx
  register: bun_setup_bunx_binary

- name: Ensure bunx is available alongside Bun
  ansible.builtin.file:
    src: /usr/local/bin/bun
    dest: /usr/local/bin/bunx
    state: link
  when: not bun_setup_bunx_binary.stat.exists

# `bun install -g` creates this directory lazily on the first global install, so the
# existence guards in the PATH blocks below only hold once something has been installed
# globally. Creating it here makes the directory exist from image build onward, so those
# guards pass in every shell and a freshly installed global binary is on PATH immediately
# instead of only after the next shell restart.
- name: Ensure Bun global bin directory exists
  ansible.builtin.file:
    path: "{{ user_home }}/.bun/bin"
    state: directory
    mode: "0755"

- name: Ensure Bun bin is on bash PATH
  ansible.builtin.blockinfile:
    path: "{{ user_home }}/.bashrc"
    create: true
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: bun_setup"
    block: |
      if [ -d "$HOME/.bun/bin" ]; then
        case ":$PATH:" in
          *":$HOME/.bun/bin:"*) ;;
          *) export PATH="$HOME/.bun/bin:$PATH" ;;
        esac
      fi

- name: Ensure fish config directory exists
  ansible.builtin.file:
    path: "{{ user_home }}/.config/fish"
    state: directory
    mode: "0755"

- name: Ensure Bun bin is on fish PATH
  ansible.builtin.blockinfile:
    path: "{{ user_home }}/.config/fish/config.fish"
    create: true
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: bun_setup"
    block: |
      if test -d "$HOME/.bun/bin"
          if not contains "$HOME/.bun/bin" $PATH
              set -gx PATH "$HOME/.bun/bin" $PATH
          end
      end

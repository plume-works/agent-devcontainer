---
# cc-filter: security layer in front of Claude Code hooks.
# https://github.com/wissem/cc-filter
agentic_tools_cc_filter_install: false
agentic_tools_cc_filter_version: v0.0.6
agentic_tools_cc_filter_install_path: /usr/local/bin/cc-filter
agentic_tools_cc_filter_binary_mode: "0755"
agentic_tools_cc_filter_download_url: >-
  https://github.com/wissem/cc-filter/releases/download/{{ agentic_tools_cc_filter_version }}/cc-filter-linux-{{ system_arch }}

# SHA-256 checksums of the release binaries, keyed by architecture. Bump
# alongside agentic_tools_cc_filter_version so a compromised or tag-floated asset is rejected.
agentic_tools_cc_filter_checksums:
  amd64: sha256:5c9dbfa6cc24027277661a0fe17fca130fdb5d2bd46ac1474bdaa843c38cf308
  arm64: sha256:2eeb50a337123b5f897070a3f0604c79fa48a54acdd1f6eb77878cf9ea14d236
agentic_tools_cc_filter_checksum: "{{ agentic_tools_cc_filter_checksums[system_arch] }}"

# Wire cc-filter into the user's Claude Code hooks (settings.json).
agentic_tools_cc_filter_configure_hooks: true
agentic_tools_cc_filter_claude_settings_path: "{{ user_home }}/.claude/settings.json"

# Stage the agent catalog into the image, so a container built from it can install
# the catalog with no clone, no network, and no firewall allowlist entry. Staging
# is a plain copy; the install below turns it into resolvable plugin state.
agentic_tools_stage_catalog: false

# Install the staged catalog into each agent's plugin state at build time, so a
# consumer that runs the image without the devcontainer lifecycle hooks still
# resolves agentdev:* skills. The devcontainer path re-installs into its mounted
# ~/.claude and ~/.codex volumes, which shadow this build-time install.
# See spec/catalog-lifecycle and architecture/ci-agent-plugin-availability.
agentic_tools_install_catalog: false

# The catalog is staged from the provisioning sources themselves, so the image and
# the catalog it carries always come from the same commit. Point this at any tree
# whose root holds a Claude Code marketplace manifest.
agentic_tools_catalog_source_dir: "{{ role_path }}/../../.."
agentic_tools_catalog_marketplace_manifest: .claude-plugin/marketplace.json
# Codex resolves its marketplace from a separate manifest under .agents/plugins/.
agentic_tools_catalog_codex_marketplace_manifest: .agents/plugins/marketplace.json
agentic_tools_plugin_name: agentdev

# Path of the Codex plugin manifest within the plugin, checked against the version
# the Claude marketplace manifest declares.
agentic_tools_catalog_codex_plugin_manifest: .codex-plugin/plugin.json

# Optional pin. When set, the manifest must declare exactly this version or the
# build fails, which is what keeps the image reproducible and its label honest.
agentic_tools_plugin_version: ""

# The staged catalog lives outside $HOME on purpose: ~/.claude and ~/.codex are
# commonly mounted as volumes, which would shadow anything placed under them.
agentic_tools_catalog_root: /opt/agentdev

# Copied whole so both marketplace manifests (.claude-plugin/marketplace.json and
# .agents/plugins/marketplace.json) and the plugin they publish keep the
# root-relative layout each manifest resolves its plugin by.
agentic_tools_catalog_trees:
  - .claude-plugin
  - .agents

# Directories 0755, files 0644, and anything already executable stays executable
# so the scripts the plugin ships in bin/ keep working.
agentic_tools_catalog_mode: "u=rwX,go=rX"

# Build scratch directories that must never survive into the image.
agentic_tools_catalog_prune_names:
  - __pycache__
  - .pytest_cache
  - .ruff_cache
  - .tmp

---
- name: Install agentic tools globally with Bun
  ansible.builtin.command:
    argv:
      - /usr/local/bin/bun
      - add
      - --global
      - "{{ item.package }}"
    creates: "/usr/local/bin/{{ item.bin }}"
  environment:
    BUN_INSTALL: /usr/local
  loop:
    - package: "@modelcontextprotocol/inspector"
      bin: mcp-inspector
    - package: "@anthropic-ai/claude-code"
      bin: claude
    - package: "@openai/codex"
      bin: codex
  loop_control:
    label: "{{ item.package }}"

- name: Install cc-filter security layer for Claude Code
  ansible.builtin.import_tasks: cc_filter.yml
  when: agentic_tools_cc_filter_install | bool

- name: Stage the agent catalog into the image
  ansible.builtin.import_tasks: stage_catalog.yml
  when: agentic_tools_stage_catalog | bool

- name: Install the staged catalog into each agent's plugin state
  ansible.builtin.import_tasks: install_catalog.yml
  when:
    - agentic_tools_stage_catalog | bool
    - agentic_tools_install_catalog | bool

---
# Stage the agent catalog into the image.
#
# This is a plain copy; install_catalog.yml installs from it through each agent's
# own plugin CLI. That build-time install lets a raw-image consumer resolve the
# catalog with no lifecycle hooks, and the container's lifecycle scripts install
# again into the mounted ~/.claude and ~/.codex volumes, which shadow it.
#
# The staged root holds both marketplace manifests, and each resolves its plugin
# by a path relative to that root, so the source layout has to be preserved.
- name: Read the catalog marketplace manifest
  ansible.builtin.slurp:
    src: >-
      {{ agentic_tools_catalog_source_dir }}/{{ agentic_tools_catalog_marketplace_manifest }}
  register: agentic_tools_catalog_manifest_raw

- name: Resolve the marketplace name and the plugin entry it publishes
  ansible.builtin.set_fact:
    agentic_tools_catalog_marketplace_name: "{{ agentic_tools_catalog_manifest.name }}"
    agentic_tools_catalog_plugin_entries: >-
      {{ agentic_tools_catalog_manifest.plugins
         | selectattr('name', 'equalto', agentic_tools_plugin_name)
         | list }}
  vars:
    agentic_tools_catalog_manifest: >-
      {{ agentic_tools_catalog_manifest_raw.content | b64decode | from_json }}

- name: Fail when the manifest does not publish exactly one matching plugin
  ansible.builtin.assert:
    that:
      - agentic_tools_catalog_plugin_entries | length == 1
    fail_msg: >-
      {{ agentic_tools_catalog_marketplace_manifest }} publishes
      {{ agentic_tools_catalog_plugin_entries | length }} plugins named
      '{{ agentic_tools_plugin_name }}'; expected exactly one.

- name: Record the staged plugin version and source path
  ansible.builtin.set_fact:
    agentic_tools_catalog_plugin_version: "{{ agentic_tools_catalog_plugin_entry.version }}"
    agentic_tools_catalog_plugin_source: >-
      {{ agentic_tools_catalog_plugin_entry.source | regex_replace('^\./', '') | regex_replace('/$', '') }}
  vars:
    agentic_tools_catalog_plugin_entry: "{{ agentic_tools_catalog_plugin_entries | first }}"

- name: Read the Codex plugin manifest
  ansible.builtin.slurp:
    src: >-
      {{ agentic_tools_catalog_source_dir }}/{{ agentic_tools_catalog_plugin_source }}/{{
         agentic_tools_catalog_codex_plugin_manifest }}
  register: agentic_tools_catalog_codex_manifest_raw

# The two manifests are released together, so a mismatch means one of them was
# missed during a version bump and the image label would describe only half the
# catalog.
- name: Fail when the Claude and Codex plugin manifests disagree on the version
  ansible.builtin.assert:
    that:
      - agentic_tools_catalog_codex_version == agentic_tools_catalog_plugin_version
    fail_msg: >-
      {{ agentic_tools_catalog_codex_plugin_manifest }} declares version
      '{{ agentic_tools_catalog_codex_version }}' but
      {{ agentic_tools_catalog_marketplace_manifest }} declares
      '{{ agentic_tools_catalog_plugin_version }}'. Bump both together.
  vars:
    agentic_tools_catalog_codex_version: >-
      {{ (agentic_tools_catalog_codex_manifest_raw.content | b64decode | from_json).version }}

- name: Fail when the pinned plugin version is not the one being staged
  ansible.builtin.assert:
    that:
      - agentic_tools_catalog_plugin_version == agentic_tools_plugin_version
    fail_msg: >-
      Pinned version '{{ agentic_tools_plugin_version }}' does not match version
      '{{ agentic_tools_catalog_plugin_version }}' declared by
      {{ agentic_tools_catalog_marketplace_manifest }}. Bump the pin and the
      manifest together so the image label stays honest.
  when: agentic_tools_plugin_version | length > 0

- name: Reset the staged catalog
  ansible.builtin.file:
    path: "{{ agentic_tools_catalog_root }}"
    state: absent

- name: Create the staged catalog directories
  ansible.builtin.file:
    path: "{{ agentic_tools_catalog_root }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ agentic_tools_catalog_trees }}"

- name: Copy the catalog into the staged tree
  ansible.builtin.command:
    argv:
      - cp
      - --archive
      - "{{ agentic_tools_catalog_source_dir }}/{{ item }}/."
      - "{{ agentic_tools_catalog_root }}/{{ item }}/"
  loop: "{{ agentic_tools_catalog_trees }}"
  changed_when: true

- name: Find build scratch directories copied into the staged catalog
  ansible.builtin.find:
    paths: "{{ agentic_tools_catalog_root }}"
    patterns: "{{ agentic_tools_catalog_prune_names }}"
    file_type: directory
    recurse: true
    hidden: true
  register: agentic_tools_catalog_scratch_dirs

- name: Remove build scratch directories from the staged catalog
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ agentic_tools_catalog_scratch_dirs.files }}"
  loop_control:
    label: "{{ item.path }}"

# Read-only by design: the lifecycle scripts only ever read from here, and a
# container that wants a different catalog registers its own on top. Updating the
# staged copy means rebuilding the image.
- name: Make the staged catalog root-owned and read-only
  ansible.builtin.file:
    path: "{{ agentic_tools_catalog_root }}"
    state: directory
    owner: root
    group: root
    mode: "{{ agentic_tools_catalog_mode }}"
    recurse: true

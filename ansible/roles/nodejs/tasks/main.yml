---
# Node.js installation
- name: Load pinned apt versions
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/apt_pins_{{ system_dist }}_{{ system_arch }}.yml"

- name: Remove old Node.js and NPM
  ansible.builtin.apt:
    name:
      - nodejs
      - npm
    state: absent

- name: Create temporary directory for downloads
  ansible.builtin.tempfile:
    state: directory
  register: nodejs_temp_dir
  become: false

- name: Download Node.js setup script
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/setup_24.x
    dest: "{{ nodejs_temp_dir.path }}/nodesource_setup.sh"
    mode: "0755"
  become: false

- name: Run Node.js setup script
  ansible.builtin.shell:
    cmd: "{{ nodejs_temp_dir.path }}/nodesource_setup.sh"
    executable: /bin/bash
    chdir: "{{ nodejs_temp_dir.path }}"
    creates: /etc/apt/sources.list.d/nodesource.list

- name: Install Node.js
  ansible.builtin.apt:
    name: "{{ nodejs_apt_pins.items() | map('join', '=') | list }}"
    allow_downgrade: true
    state: present
    install_recommends: false

# `bun pm ls --global` prints one "<package>@<version>" per line under a tree
# prefix. Comparing against the pinned spec makes a version bump reinstall,
# which a guard on the binary's existence alone would skip.
- name: Read the globally installed Bun packages
  ansible.builtin.command:
    argv:
      - /usr/local/bin/bun
      - pm
      - ls
      - --global
  environment:
    BUN_INSTALL: /usr/local
  register: nodejs_bun_global
  changed_when: false
  failed_when: false

- name: Collect the installed Bun package specs
  ansible.builtin.set_fact:
    nodejs_bun_global_specs: >-
      {{ nodejs_bun_global.stdout_lines | map('regex_replace', '^[^@A-Za-z]+', '') | map('trim') | list }}

- name: Install Yarn globally with Bun
  ansible.builtin.command:
    argv:
      - /usr/local/bin/bun
      - add
      - --global
      - --exact
      - "yarn@{{ nodejs_yarn_version }}"
  environment:
    BUN_INSTALL: /usr/local
  changed_when: true
  when: ('yarn@' ~ nodejs_yarn_version) not in nodejs_bun_global_specs

- name: Clean up temporary directory
  ansible.builtin.file:
    path: "{{ nodejs_temp_dir.path }}"
    state: absent
  become: false
  when: nodejs_temp_dir.path is defined

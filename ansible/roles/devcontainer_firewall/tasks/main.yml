---
- name: Load pinned apt versions
  ansible.builtin.include_vars:
    file: "{{ role_path }}/vars/apt_pins_{{ system_dist }}_{{ system_arch }}.yml"

- name: Install firewall tools
  ansible.builtin.apt:
    name: "{{ devcontainer_firewall_apt_pins.items() | map('join', '=') | list }}"
    state: present
    update_cache: true
    install_recommends: false

- name: Install init-firewall.sh script
  ansible.builtin.copy:
    src: init-firewall.sh
    dest: /usr/local/bin/init-firewall.sh
    owner: root
    group: root
    mode: "0755"

- name: Allow passwordless sudo for init-firewall.sh
  ansible.builtin.copy:
    src: devcontainer-firewall-sudoers
    dest: /etc/sudoers.d/devcontainer-firewall
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

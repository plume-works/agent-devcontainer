---
# Fish shell setup
- name: Install fish
  ansible.builtin.apt:
    name: fish
    state: present
    update_cache: true
    install_recommends: false

- name: Ensure fish config directory exists
  ansible.builtin.file:
    path: "{{ user_home }}/.config/fish/conf.d"
    state: directory
    mode: "0755"
    owner: root
    group: root
  become: true
  become_user: "{{ dev_user }}"

- name: Create temporary directory for downloads
  ansible.builtin.tempfile:
    state: directory
  register: fish_setup_temp_dir
  become: true
  become_user: "{{ dev_user }}"

# fish_plugins is fisher's declaration of what should be installed, and
# `fisher update` reconciles the tree to it -- installing what is listed,
# updating what moved, and removing what is not. Writing the pinned specs into
# that file and updating is therefore the whole install: it converges from an
# empty system and from one carrying plugins installed under a different spec,
# which `fisher install` refuses to overwrite.
- name: Collect the pinned fish plugin specs
  ansible.builtin.set_fact:
    fish_setup_wanted_plugins:
      - "jorgebucaran/fisher@{{ fish_setup_fisher_version }}"
      - "edc/bass@{{ fish_setup_bass_ref }}"

- name: Read the installed fish plugin list
  ansible.builtin.slurp:
    src: "{{ user_home }}/.config/fish/fish_plugins"
  register: fish_setup_plugins
  failed_when: false
  become: true
  become_user: "{{ dev_user }}"

- name: Collect the installed fish plugin specs
  ansible.builtin.set_fact:
    fish_setup_plugin_specs: >-
      {{ (fish_setup_plugins.content | default('') | b64decode).split() }}

# fisher is bootstrapped from the downloaded copy rather than from the
# installed one, so the same tasks work before it exists.
- name: Download fisher (fish package manager)
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/jorgebucaran/fisher/{{ fish_setup_fisher_version }}/functions/fisher.fish"
    dest: "{{ fish_setup_temp_dir.path }}/fisher.fish"
    mode: "0755"
  become: true
  become_user: "{{ dev_user }}"
  when: fish_setup_plugin_specs != fish_setup_wanted_plugins

- name: Record the pinned fish plugin list
  ansible.builtin.copy:
    content: "{{ fish_setup_wanted_plugins | join('\n') }}\n"
    dest: "{{ user_home }}/.config/fish/fish_plugins"
    mode: "0644"
  become: true
  become_user: "{{ dev_user }}"
  when: fish_setup_plugin_specs != fish_setup_wanted_plugins

- name: Reconcile the installed fish plugins with the pinned list
  ansible.builtin.shell:
    cmd: >-
      source {{ fish_setup_temp_dir.path }}/fisher.fish
      && fisher update
    chdir: "{{ fish_setup_temp_dir.path }}"
    executable: fish
  become: true
  become_user: "{{ dev_user }}"
  changed_when: true
  when: fish_setup_plugin_specs != fish_setup_wanted_plugins

- name: Copy development fish configuration
  ansible.builtin.template:
    src: dev.fish.j2
    dest: "{{ user_home }}/.config/fish/conf.d/dev.fish"
    mode: "0644"
    owner: root
    group: root
  become: false

- name: Clean up temporary directory
  ansible.builtin.file:
    path: "{{ fish_setup_temp_dir.path }}"
    state: absent
  become: false
  when: fish_setup_temp_dir.path is defined

---
# The catalog is staged from the provisioning sources themselves, so the image and
# the catalog it carries always come from the same commit. Point this at any tree
# whose root holds a Claude Code marketplace manifest.
agent_catalog_source_dir: "{{ role_path }}/../../.."
agent_catalog_marketplace_manifest: .claude-plugin/marketplace.json

# Optional pin on the version of this plugin. When set, the manifest must declare
# exactly this version or the build fails, which keeps the image label honest.
agent_catalog_plugin_name: agentdev
agent_catalog_plugin_version: ""

# The staged catalog lives outside $HOME on purpose: ~/.claude is commonly
# mounted as a volume, which would shadow anything placed under them.
agent_catalog_root: /opt/agentdev

# Copied whole, with the source directory of every plugin the manifest publishes,
# so each keeps the root-relative layout the manifest resolves it by. The .agents/
# root files are publisher-only contributor instructions and stay out.
agent_catalog_trees:
  - .claude-plugin

# The agentdev-lib wheel built from the provisioning sources. The image points
# UV_FIND_LINKS here, and each staged plugin's uv.lock names it, so it stays.
agent_catalog_lib_source: py_packages/agentdev_lib
agent_catalog_wheel_dir: "{{ agent_catalog_root }}/wheels"
# The image's interpreter, never a downloaded one, and no cache in the layer.
agent_catalog_uv_environment:
  UV_PYTHON: /usr/bin/python3
  UV_PYTHON_DOWNLOADS: never
  UV_NO_CACHE: "1"
  UV_LINK_MODE: copy

# Directories 0755, files 0644, and anything already executable stays executable
# so the scripts the plugin ships in bin/ keep working.
agent_catalog_mode: "u=rwX,go=rX"

# Directories that must never survive into the image: build scratch, and plugin
# test suites, which only ever run in the publisher checkout.
agent_catalog_prune_names:
  - __pycache__
  - .pytest_cache
  - .ruff_cache
  - .tmp
  - tests

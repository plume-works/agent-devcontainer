---
# Source of the validator package. The image build points this at the repository
# build context bind-mounted at /provision; the default suits running the role
# straight from a checkout.
validate_agent_files_source_dir: "{{ role_path }}/../../../py_packages/validate_agent_files"

# Optional pin. When set, the version actually installed must equal this or the
# build fails, which is what keeps the image label honest. Same contract as
# agentic_tools_plugin_version.
validate_agent_files_version: ""

# The entry point goes somewhere every user has on PATH.
validate_agent_files_bin_dir: /usr/local/bin

# Isolated tool environment, outside $HOME so a mounted home volume cannot shadow
# it, and away from any uv-managed project environment.
validate_agent_files_tool_dir: /opt/uv-tools

# uv names the tool environment after the PEP 503-normalized project name.
validate_agent_files_dist_name: validate-agent-files

# Ubuntu 24.04 ships Python 3.12 and the package requires >=3.11, so there is no
# reason to bake a uv-managed interpreter into the image.
validate_agent_files_python: /usr/bin/python3

validate_agent_files_uv: /usr/local/bin/uv

# Directories 0755, files 0644, executables stay executable.
validate_agent_files_tool_mode: "u=rwX,go=rX"

# Build scratch that must never reach the wheel build. *.egg-info is the load
# bearing one: setuptools writes it into the source tree, so a stale copy from an
# editable install would be picked up as metadata.
validate_agent_files_prune_names:
  - "*.egg-info"
  - __pycache__
  - .pytest_cache
  - .ruff_cache
  - .tmp

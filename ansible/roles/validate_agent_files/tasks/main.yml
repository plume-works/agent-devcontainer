---
# Install the validate_agent_files CLI into the image as an isolated uv tool.
#
# The package is not published to PyPI, so it is built from the provisioning
# sources: the image and the validator it carries always come from the same
# commit, exactly like the staged agent catalog.
- name: Stat the validator package source
  ansible.builtin.stat:
    path: "{{ validate_agent_files_source_dir }}/pyproject.toml"
  register: validate_agent_files_source_stat

- name: Fail when the validator package source is missing
  ansible.builtin.assert:
    that:
      - validate_agent_files_source_stat.stat.exists
    fail_msg: >-
      No pyproject.toml under '{{ validate_agent_files_source_dir }}'. The validator is
      built from the provisioning sources, so a tree that does not carry
      py_packages/validate_agent_files/ cannot install it. Point
      validate_agent_files_source_dir at the package, or build with
      install_validate_agent_files=false.

# The build context is bind-mounted read-only and setuptools writes
# *.egg-info into the source tree while preparing metadata, so the wheel cannot
# be built in place. Copy the source out first, as stage_catalog.yml does for
# the catalog.
- name: Create a temporary directory for the validator build
  ansible.builtin.tempfile:
    state: directory
    suffix: validate-agent-files
  register: validate_agent_files_build_dir

- name: Copy the validator package source into the build directory
  ansible.builtin.command:
    argv:
      - cp
      - --archive
      - "{{ validate_agent_files_source_dir }}/."
      - "{{ validate_agent_files_build_dir.path }}/"
  changed_when: true

- name: Find build scratch directories copied into the build directory
  ansible.builtin.find:
    paths: "{{ validate_agent_files_build_dir.path }}"
    patterns: "{{ validate_agent_files_prune_names }}"
    file_type: directory
    recurse: true
    hidden: true
  register: validate_agent_files_scratch_dirs

- name: Remove build scratch directories from the build directory
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ validate_agent_files_scratch_dirs.files }}"
  loop_control:
    label: "{{ item.path }}"

# No `creates:` guard: a warm-start build runs on top of the previous image,
# whose validator came from an older commit, so the install must always replace it.
- name: Install the validator as a uv tool
  ansible.builtin.command:
    argv:
      - "{{ validate_agent_files_uv }}"
      - tool
      - install
      - --reinstall
      - --python
      - "{{ validate_agent_files_python }}"
      - "{{ validate_agent_files_build_dir.path }}"
  changed_when: true
  environment:
    UV_TOOL_BIN_DIR: "{{ validate_agent_files_bin_dir }}"
    UV_TOOL_DIR: "{{ validate_agent_files_tool_dir }}"
    # The interpreter is already present; never bake a downloaded one in.
    UV_PYTHON_DOWNLOADS: "never"
    # Nothing installs tools at runtime, so a build cache would be dead weight
    # in the layer.
    UV_NO_CACHE: "1"
    UV_LINK_MODE: copy

# Reading the version back from the installed distribution, rather than parsing
# the source pyproject.toml, checks what the image actually carries.
- name: Read the version of the installed validator
  ansible.builtin.command:
    argv:
      - "{{ validate_agent_files_tool_dir }}/{{ validate_agent_files_dist_name }}/bin/python"
      - -c
      - import importlib.metadata as m; print(m.version('validate_agent_files'))
  register: validate_agent_files_installed_version
  changed_when: false

- name: Fail when the pinned validator version is not the one installed
  ansible.builtin.assert:
    that:
      - validate_agent_files_installed_version.stdout | trim == validate_agent_files_version
    fail_msg: >-
      Pinned version '{{ validate_agent_files_version }}' does not match installed version
      '{{ validate_agent_files_installed_version.stdout | trim }}'. Bump the pin and
      py_packages/validate_agent_files/pyproject.toml together so the image label stays
      honest.
  when: validate_agent_files_version | length > 0

- name: Make the tool environment root-owned and world-readable
  ansible.builtin.file:
    path: "{{ validate_agent_files_tool_dir }}"
    state: directory
    owner: root
    group: root
    mode: "{{ validate_agent_files_tool_mode }}"
    recurse: true

- name: Remove the temporary build directory
  ansible.builtin.file:
    path: "{{ validate_agent_files_build_dir.path }}"
    state: absent

# Runs last, after the permission change, so it also proves the entry point is
# usable by a user who is not root.
- name: Verify the validator entry point runs
  ansible.builtin.command:
    argv:
      - "{{ validate_agent_files_bin_dir }}/validate_agent_files"
      - --help
  changed_when: false

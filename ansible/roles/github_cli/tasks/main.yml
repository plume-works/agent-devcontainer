---
# Install GitHub CLI from the official repository
- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Install GitHub CLI prerequisites
  ansible.builtin.apt:
    name: wget
    state: present
    update_cache: true
    install_recommends: false

- name: Add GitHub CLI GPG key
  ansible.builtin.get_url:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
    mode: "0644"
    force: false

- name: Add GitHub CLI repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ system_arch }} signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg]
      https://cli.github.com/packages stable main
    state: present
    filename: github-cli
    update_cache: true

- name: Install GitHub CLI
  ansible.builtin.apt:
    name: gh
    state: present
    install_recommends: false

# Wraps the real gh (above) with a transparent auth shim that injects GH_TOKEN
# from the host's git credential helper. /usr/local/bin precedes /usr/bin on the
# default PATH, so this copy is every shell's gh; see spec/devcontainer-git-credentials.
- name: Install the gh wrapper
  ansible.builtin.copy:
    src: gh
    dest: /usr/local/bin/gh
    mode: "0755"
    owner: root
    group: root

# A checkout's own gh must never run ahead of the wrapper: see
# spec/devcontainer-git-credentials.
- name: Find the shell configs that may carry the workspace gh PATH prepend
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ user_home }}/.bashrc"
    - "{{ user_home }}/.config/fish/config.fish"
  register: github_cli_shell_configs

- name: Remove the workspace gh PATH prepend
  ansible.builtin.blockinfile:
    path: "{{ item.stat.path }}"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: github_cli_wrapper"
    state: absent
  loop: "{{ github_cli_shell_configs.results | selectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item }}"

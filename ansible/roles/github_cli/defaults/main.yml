---
# gh-stack: GitHub native stacked pull requests (`gh stack`), installed as a
# precompiled gh extension; see architecture/stacked-prs.
# renovate: datasource=github-releases depName=github/gh-stack
github_cli_gh_stack_version: "v0.3.0"
github_cli_gh_stack_download_url: >-
  https://github.com/github/gh-stack/releases/download/{{ github_cli_gh_stack_version }}/linux-{{ system_arch }}

# SHA-256 checksums of the release binaries, keyed by architecture. Renovate's
# post-upgrade script recomputes them on a bump.
github_cli_gh_stack_checksums:
  amd64: sha256:957e822cfa7e435cd84a297cd96c419b58e51e3ac58be249762c24bd9e45099b
  arm64: sha256:803ec91eeba9b2ac38827e299a79830fe75ca7284f0c28d60e6a2704bb34ed13
github_cli_gh_stack_checksum: "{{ github_cli_gh_stack_checksums[system_arch] }}"
github_cli_gh_stack_dir: "{{ user_home }}/.local/share/gh/extensions/gh-stack"

---
# Default workspace folder inside the container. Roles that need the path at
# runtime read DEV_WORKSPACE_FOLDER first and fall back to this value, so a
# consuming project can mount its workspace anywhere.
workspace_folder: /workspaces/project

# Docker Engine + CLI. Installed but not started; install_docker_service (or the
# devcontainer docker-in-docker feature) starts the daemon.
install_docker: false

# Xpra remote desktop with the HTML5 client.
install_xpra: false

# Claude Code, Codex, and the MCP inspector.
install_agentic_tools: false

# The validate_agent_files CLI, built from py_packages/validate_agent_files/ in the
# provisioning sources. Turn it off when building from a tree that does not carry
# that package.
install_validate_agent_files: false

# Egress firewall. Installing it only places init-firewall.sh and its sudoers
# entry in the image; ENABLE_FIREWALL=true at container start actually applies it.
install_devcontainer_firewall: false

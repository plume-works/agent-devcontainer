---
# Main playbook: provision a general-purpose development container.
#
# Capability roles are opt-in; docker/desktop/agent-desktop.Dockerfile turns them
# all on when building the published image.
- name: Setup development environment
  hosts: all
  become: true
  gather_facts: true

  roles:
    - { role: extra_facts, tags: ["extra_facts", "always"] }
    - { role: basic_prereqs, tags: ["basic_prereqs"] }
    - { role: install_docker, tags: ["install_docker"], when: install_docker | default(false) | bool }
    - { role: locale_setup, tags: ["locale_setup"] }
    - { role: utc_timezone, tags: ["utc_timezone"] }
    - { role: fish_setup, tags: ["fish_setup"] }
    - { role: bash_setup, tags: ["bash_setup"] }
    - { role: cmake_kitware, tags: ["cmake"] }
    - { role: dev_tools, tags: ["dev_tools"] }
    - { role: github_cli, tags: ["github_cli"] }
    # bun_setup must precede nodejs and agentic_tools: both install global
    # packages through `bun add --global`.
    - { role: bun_setup, tags: ["bun_setup", "nodejs", "agentic_tools"] }
    - { role: nodejs, tags: ["nodejs"] }
    - { role: uv_setup, tags: ["uv_setup"] }
    # Must follow uv_setup: the validator is installed as a uv tool.
    - { role: validate_agent_files, tags: ["validate_agent_files"], when: install_validate_agent_files | default(false) | bool }
    - { role: agentic_tools, tags: ["agentic_tools"], when: install_agentic_tools | default(false) | bool }
    - { role: xpra_setup, tags: ["xpra_setup"], when: install_xpra | default(false) | bool }
    - { role: devcontainer_firewall, tags: ["devcontainer_firewall"], when: install_devcontainer_firewall | default(false) | bool }
    # Guard, not diagnostics: fail the build if any role handed a shared
    # /usr/local directory to an unrelated owner. A third-party release archive
    # carrying its build runner's numeric uid/gid can silently chown the
    # directory it unpacks into (see ansible/roles/perm_probe/README.md), and a
    # bad ownership baked into the published image is inherited by every warm
    # build layered on top of it — so this must break the build rather than ship.
    - { role: perm_probe, perm_probe_label: "final", perm_probe_fail_on_drift: true, tags: ["always"] }
